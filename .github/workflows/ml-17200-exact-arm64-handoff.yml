name: ML 1.7.200 exact ARM64 QA signing handoff

on:
  push:
    branches: [feature/ml-17200-rebind-gallery-status]
    paths:
      - .github/workflows/ml-17200-exact-arm64-handoff.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle and SDK
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version --no-daemon
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble ARM64 release and check identity
        run: |
          set -euo pipefail
          grep -Eq 'versionCode 260$' app/build.gradle
          grep -Fq "versionName '1.7.200'" app/build.gradle
          ./gradlew :app:assembleRelease -Parm64Release=true --stacktrace --no-daemon
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$bt/aapt" dump badging "$apk" | grep -F "name='com.domenota.medialoader' versionCode='260' versionName='1.7.200'"
          test "$(unzip -Z1 "$apk" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
          mkdir -p out
          "$bt/zipalign" -p -f 4 "$apk" out/ML_1.7.200_ARM64_ALIGNED_UNSIGNED.apk
          "$bt/zipalign" -c -P 16 4 out/ML_1.7.200_ARM64_ALIGNED_UNSIGNED.apk
          cp "$bt/lib/apksigner.jar" out/apksigner-35.0.0.jar
          git archive --format=zip -o out/ML_1.7.200_SOURCES_EXACT_COMMIT.zip HEAD
          printf '%s\n' "$GITHUB_SHA" > out/DELIVERY_COMMIT_SHA.txt
          (cd out && sha256sum ML_1.7.200_ARM64_ALIGNED_UNSIGNED.apk ML_1.7.200_SOURCES_EXACT_COMMIT.zip apksigner-35.0.0.jar > UNSIGNED_HANDOFF_SHA256.txt)
      - name: Keep exact source and unsigned artifacts private to workflow
        uses: actions/upload-artifact@v4
        with:
          name: ML_1.7.200_EXACT_UNSIGNED_SIGNING_HANDOFF
          path: out/
          retention-days: 3
          if-no-files-found: error
