name: ML round 2 stage 1 phone scan performance
on:
  push:
    branches: [fix/ml-round2-stage1-scan-checkpoints-20261101]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ml-round2-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gallery-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Full unit suite
        run: gradle :app:testDebugUnitTest -Parm64Release=true --stacktrace
      - name: Android Lint
        if: success() || failure()
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: ARM64 debug compile
        if: success() || failure()
        run: gradle :app:assembleDebug -Parm64Release=true --stacktrace
