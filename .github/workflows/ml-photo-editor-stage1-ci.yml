name: ML photo editor stage 1 — UI validation
on:
  push:
    branches:
      - feature/ml-photo-editor-stage1-xiaomi-ui-20261031
  workflow_dispatch:

concurrency:
  group: ml-photo-stage1-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  android-check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: UI unit tests and regression suite
        run: gradle :app:testDebugUnitTest -Parm64Release=true --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: Build debug ARM64 without publishing an APK
        run: gradle :app:assembleDebug -Parm64Release=true --stacktrace
