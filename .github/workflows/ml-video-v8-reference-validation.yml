name: MediaLoader v8 reference UI UX rebuild validation
on:
  push:
    branches:
      - feature/ml-video-editor-v8-reference-rebuild-20261102
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-video-editor-v8-reference
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install fixture decoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate synthetic H264 fixture before codec tests
        run: python3 scripts/verify-video-fx-fixture.py
      - name: Run all Android unit and Compose tests
        run: gradle :app:testDebugUnitTest -Parm64Release=true --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: Verify all JavaScript/WebView scripts
        run: |
          node scripts/test-youtube-thumbnail.cjs
          node scripts/test-hitmoz-native-script.cjs
          node scripts/test-muzmo-native-script.cjs
      - name: Compile isolated ARM64 QA package
        run: gradle :app:assembleDebug -Parm64Release=true -PhitmozArm64=true --stacktrace
      - name: Verify QA identity, ABI and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -s "$apk"
          "$bt/aapt" dump badging "$apk" | grep -F "package: name='com.domenota.medialoader.hitmoz'"
          "$bt/apksigner" verify --print-certs "$apk"
          test "$(unzip -Z1 "$apk" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
          sha256sum "$apk"
      - name: Verify 1.7.112 production ARM64 release compile and size
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease -Parm64Release=true --stacktrace
          file=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$file"
          aapt="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$file" | grep -F "com.domenota.medialoader"
          "$aapt" dump badging "$file" | grep -F "1.7.112"
          bytes=$(stat -c %s "$file")
          echo "Unsigned release size: $bytes bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$bytes" -lt 130000000
      - name: Preserve unit and lint reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-v8-unit-lint-${{ github.sha }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results*
          if-no-files-found: warn
          retention-days: 7
      - name: Keep short-lived CI APK (not published as QA prerelease)
        uses: actions/upload-artifact@v4
        with:
          name: ML-Video-v8-Reference-ARM64-CI
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  # This is a real Android codec test, independent of JVM/Robolectric
  # snapshot tests. It decodes the completed MP4 and checks its pixels.
  mp4-codec-device:
    name: Real MP4 effect on Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Verify the exported MP4 pixels using Android Media3 codec
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/run-video-fx-device-tests.sh
      - name: Preserve real-codec evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-v8-device-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/video-fx-logcat.txt
            app/build/video-fx-evidence/
          if-no-files-found: warn
          retention-days: 7
