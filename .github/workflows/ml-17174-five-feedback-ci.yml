name: ML 1.7.174 Xiaomi feedback - 7 fixes QA
on:
  push:
    branches:
      - fix/ml-17174-five-device-feedback-20261111
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-17174-five-feedback-qa
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle and SDK 35
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4; do
            ./gradlew --version --no-daemon && break
            test "$i" != 4
            sleep 10
          done
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate exact app identity
        run: |
          grep -Fq "versionName '1.7.174'" app/build.gradle
          grep -Fq "applicationId 'com.domenota.medialoader'" app/build.gradle
      - name: Focused player, private and AI segmentation regressions
        run: |
          ./gradlew :app:testDebugUnitTest -Parm64Release=true \
            --tests '*GalleryVideoChromeTest' \
            --tests '*PrivateViewerChromeTest' \
            --tests '*PrivateScreenUiTest' \
            --tests '*PersonInstancePolicyTest' \
            --tests '*PersonSegmentationPipelineTest' \
            --tests '*PersonManualRefinementMaskTest' \
            --tests '*GalleryV10ActionContractTest' \
            --tests '*OcrLineCandidatePolicyTest' \
            --tests '*TextGlyphMaskTest' \
            --tests '*GlyphContentMaskTest' \
            --tests '*LocalTextOcrFallbackTest' \
            --tests '*LaMaInputSamplingEquivalenceTest' \
            --tests '*InpaintingPreparationTest' \
            --tests '*LaMaCompositionTest' \
            --stacktrace
      - name: Full JVM suite
        run: ./gradlew :app:testDebugUnitTest -Parm64Release=true --stacktrace
      - name: Android lint
        if: always()
        run: ./gradlew :app:lintDebug -Parm64Release=true --stacktrace
      - name: ARM64 compile only (never publish this unsigned APK)
        if: success()
        run: |
          ./gradlew :app:assembleRelease -Parm64Release=true --stacktrace
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test "$(unzip -Z1 app/build/outputs/apk/release/app-release-unsigned.apk | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
      - name: Diagnostic reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml17174-five-feedback-diagnostics
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 4
