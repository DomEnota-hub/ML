name: MediaLoader Gallery bulk album move QA
on:
  push:
    branches:
      - feature/ml-17140-gallery-bulk-album-move-20261106
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-gallery-bulk-album-move
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK setup
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Bulk album move and gallery regressions
        run: |
          gradle :app:testDebugUnitTest -Parm64Release=true \
            --tests '*GalleryBulkAlbumMoveTest' \
            --tests '*GalleryMultipleSelectionTest' \
            --tests '*GalleryAlbumNavigationTest' \
            --tests '*GalleryLibraryStateTest' --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: Build ARM64 Release (unsigned QA artifact; not a GitHub release)
        run: gradle :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Sign the exact ARM64 package with protected DomEnota identity
        shell: bash
        env:
          ML_RELEASE_KEYSTORE_BASE64: ${{ secrets.ML_RELEASE_KEYSTORE_BASE64 }}
          ML_RELEASE_STORE_PASSWORD: ${{ secrets.ML_RELEASE_STORE_PASSWORD }}
          ML_RELEASE_KEY_ALIAS: ${{ secrets.ML_RELEASE_KEY_ALIAS }}
          ML_RELEASE_KEY_PASSWORD: ${{ secrets.ML_RELEASE_KEY_PASSWORD }}
          ML_RELEASE_SIGNER_SHA256: ${{ secrets.ML_RELEASE_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          for name in ML_RELEASE_KEYSTORE_BASE64 ML_RELEASE_STORE_PASSWORD ML_RELEASE_KEY_ALIAS ML_RELEASE_KEY_PASSWORD ML_RELEASE_SIGNER_SHA256; do
            test -n "${!name:-}" || { echo "::error::Missing protected signing input: $name"; exit 1; }
          done
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          "$bt/aapt" dump badging "$unsigned" | grep -F "package: name='com.domenota.medialoader' versionCode='201' versionName='1.7.140'"
          test "$(unzip -Z1 "$unsigned" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = "arm64-v8a"
          key="$RUNNER_TEMP/ml-release.jks"
          aligned="$RUNNER_TEMP/ml-17140-aligned.apk"
          mkdir -p handoff
          signed="handoff/ML_1.7.140_ARM64_DomEnota_SIGNED.apk"
          trap 'rm -f "$key" "$aligned"' EXIT
          printf "%s" "$ML_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          "$bt/zipalign" -p -f 4 "$unsigned" "$aligned"
          "$bt/apksigner" sign --min-sdk-version 26 --ks "$key" \
            --ks-key-alias "$ML_RELEASE_KEY_ALIAS" --ks-pass env:ML_RELEASE_STORE_PASSWORD \
            --key-pass env:ML_RELEASE_KEY_PASSWORD --out "$signed" "$aligned"
          "$bt/apksigner" verify --verbose "$signed"
          cert=$("$bt/apksigner" verify --print-certs "$signed" | sed -nE 's/^Signer #1 certificate SHA-256 digest: ([0-9a-fA-F:]+).*$/\1/p' | head -n1 | tr "[:upper:]" "[:lower:]" | tr -d ":")
          expected=$(printf "%s" "$ML_RELEASE_SIGNER_SHA256" | tr "[:upper:]" "[:lower:]" | tr -d ": ")
          test -n "$cert" && test "$cert" = "$expected" || { echo "::error::Incorrect signing certificate"; exit 1; }
          "$bt/aapt" dump badging "$signed" | grep -F "package: name='com.domenota.medialoader' versionCode='201' versionName='1.7.140'"
          test "$(unzip -Z1 "$signed" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = "arm64-v8a"
          zip -0 -q -s 80m "handoff/ML_1.7.140_ARM64_DomEnota_SIGNED.zip" "$signed"
          sha256sum "$signed" handoff/*.z01 handoff/*.zip > handoff/SHA256.txt
      - name: Preserve signed APK for direct storage transfer (not a prerelease)
        uses: actions/upload-artifact@v4
        with:
          name: ml-17140-arm64-dom-enota-signed-full
          path: handoff/ML_1.7.140_ARM64_DomEnota_SIGNED.apk
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Preserve part 1 for Google Drive fallback (under 100 MB)
        uses: actions/upload-artifact@v4
        with:
          name: ml-17140-arm64-dom-enota-z01
          path: handoff/ML_1.7.140_ARM64_DomEnota_SIGNED.z01
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Preserve final part and hashes for Google Drive fallback
        uses: actions/upload-artifact@v4
        with:
          name: ml-17140-arm64-dom-enota-zip
          path: |
            handoff/ML_1.7.140_ARM64_DomEnota_SIGNED.zip
            handoff/SHA256.txt
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Save diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-gallery-bulk-album-move-diagnostics-${{ github.sha }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 7
