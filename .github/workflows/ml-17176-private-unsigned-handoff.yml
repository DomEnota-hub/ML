name: ML 1.7.176 final unsigned handoff for local DomEnota signing
on:
  push:
    branches:
      - delivery/ml-17176-final-handoff-20261112
    paths:
      - .github/workflows/ml-17176-private-unsigned-handoff.yml
permissions:
  contents: read
concurrency:
  group: ml17176-final-private-handoff
  cancel-in-progress: true
jobs:
  unsigned:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle and Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for n in 1 2 3 4; do
            ./gradlew --version --no-daemon && break
            test "$n" != 4
            sleep 10
          done
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify production identity and compile unsigned ARM64
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'versionCode 236$' app/build.gradle
          grep -Fq "versionName '1.7.176'" app/build.gradle
          grep -Fq "applicationId 'com.domenota.medialoader'" app/build.gradle
          ./gradlew :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Align unsigned APK and archive exact sources
        shell: bash
        run: |
          set -euo pipefail
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          input=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$input"
          "$bt/aapt" dump badging "$input" | grep -F "package: name='com.domenota.medialoader' versionCode='236' versionName='1.7.176'"
          test "$(unzip -Z1 "$input" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
          mkdir -p handoff/tools handoff/source
          aligned=handoff/ML_1.7.176_ARM64_ALIGNED_UNSIGNED.apk
          "$bt/zipalign" -p -f 4 "$input" "$aligned"
          "$bt/zipalign" -c -v 4 "$aligned"
          cp "$bt/lib/apksigner.jar" handoff/tools/apksigner.jar
          git archive --format=zip -o handoff/source/ML_1.7.176_SOURCES_EXACT_COMMIT.zip HEAD
          git rev-parse HEAD > handoff/source/DELIVERY_COMMIT_SHA.txt
          printf '%s\n' 'ca5ef958df2ec9982b27696e93aca038e3ade1a7' > handoff/source/APP_VERIFIED_PR120_SHA.txt
          (cd handoff && sha256sum ML_1.7.176_ARM64_ALIGNED_UNSIGNED.apk tools/apksigner.jar source/ML_1.7.176_SOURCES_EXACT_COMMIT.zip > UNSIGNED_HANDOFF_SHA256.txt)
          test -s handoff/tools/apksigner.jar
      - name: Temporary handoff for OFF-GITHUB signing (NEVER secrets or a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: ML_1.7.176_PRIVATE_UNSIGNED_LOCAL_SIGNING
          path: handoff/
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
