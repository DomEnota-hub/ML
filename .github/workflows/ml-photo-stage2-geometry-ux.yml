name: ML photo editor stage 2 geometry and touch QA (ARM64)
on:
  push:
    branches: [feature/ml-photo-stage2-geometry-ux-20261101]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-photo-stage2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometry-and-crop-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Full unit and regression tests
        run: gradle :app:testDebugUnitTest -Parm64Release=true --stacktrace
      - name: Android lint
        if: success() || failure()
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: Compile ARM64 debug (no APK upload or signing)
        if: success() || failure()
        run: gradle :app:assembleDebug -Parm64Release=true --stacktrace
