name: Android release

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check WebView injections
        run: node scripts/test-youtube-thumbnail.cjs
      - name: Test, lint and assemble ARM64 release
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Verify production package, version and ABI
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          expected_code=$(sed -nE 's/^[[:space:]]*versionCode ([0-9]+)[[:space:]]*$/\1/p' app/build.gradle | head -n 1)
          expected_name=$(sed -nE "s/^[[:space:]]*versionName '([^']+)'[[:space:]]*$/\1/p" app/build.gradle | head -n 1)
          test -n "$expected_code" && test -n "$expected_name"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.domenota.medialoader' versionCode='$expected_code' versionName='$expected_name'"
          test "$(unzip -Z1 "$apk" | grep '^lib/' | cut -d/ -f2 | sort -u)" = arm64-v8a
