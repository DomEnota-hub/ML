name: MediaLoader 1.7.141 gallery QA and ARM64 handoff
on:
  push:
    branches:
      - feature/ml-17141-gallery-album-natural-sort-20261106
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-17141-album-folder-qa
  cancel-in-progress: true
jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Album natural sort and Downloads folder consistency regressions
        run: |
          gradle :app:testDebugUnitTest -Parm64Release=true \
            --tests '*GapiKeyStoreTest' \
            --tests '*GapiInstagramProviderTest' \
            --tests '*GalleryAlbumFileSortTest' \
            --tests '*DownloadsGalleryOnlyFoldersTest' \
            --tests '*GalleryAlbumNavigationTest' \
            --tests '*GalleryMultipleSelectionTest' \
            --tests '*GalleryBulkAlbumMoveTest' \
            --tests '*DownloadsGroupActionsUiTest' --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: Assemble real ARM64 Release without GitHub prerelease
        run: gradle :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Align and validate Release for private local signing
        shell: bash
        run: |
          set -euo pipefail
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          mkdir -p handoff
          test -s "$unsigned"
          "$bt/aapt" dump badging "$unsigned" | grep -F "package: name='com.domenota.medialoader' versionCode='202' versionName='1.7.141'"
          test "$(unzip -Z1 "$unsigned" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = "arm64-v8a"
          "$bt/zipalign" -p -f 4 "$unsigned" handoff/ML_1.7.141_ARM64_ALIGNED_UNSIGNED.apk
          "$bt/zipalign" -c -v 4 handoff/ML_1.7.141_ARM64_ALIGNED_UNSIGNED.apk
          sha256sum handoff/ML_1.7.141_ARM64_ALIGNED_UNSIGNED.apk > handoff/SHA256.txt
      - name: Preserve unsigned for private DomEnota signing
        uses: actions/upload-artifact@v4
        with:
          name: ml-17141-arm64-aligned-unsigned
          path: handoff/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Preserve diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-17141-qa-diagnostics
          path: |
            app/build/test-results
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: warn
