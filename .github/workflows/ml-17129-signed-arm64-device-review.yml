name: MediaLoader 1.7.129 ARM64 unsigned handoff for local DomEnota signing
on:
  push:
    branches:
      - feature/ml-17128-recognition-bulk-progress-cards-20261104
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-17129-unsigned-handoff
  cancel-in-progress: true

jobs:
  build-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile Release ARM64 from PR55 source
        run: gradle :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Verify version, package, ABI and size
        shell: bash
        run: |
          set -euo pipefail
          file="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$file"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$file" |
            grep -F "package: name='com.domenota.medialoader' versionCode='190' versionName='1.7.129'"
          test "$(unzip -Z1 "$file" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
          test "$(stat -c %s "$file")" -le 130000000
          sha256sum "$file" | tee "$RUNNER_TEMP/unsigned-sha256.txt"
      - name: Upload unsigned candidate for offline private signing
        uses: actions/upload-artifact@v4
        with:
          name: ML-1.7.129-ARM64-unsigned-for-DomEnota-local-sign
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
