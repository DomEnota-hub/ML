name: MediaLoader 1.7.111 group 2 music validation
on:
  push:
    branches:
      - feature/ml-17111-group2-music-4-7-20261102
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-17111-group2-music
  cancel-in-progress: false

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Complete unit and Compose tests
        run: gradle :app:testDebugUnitTest -Parm64Release=true --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: Compile isolated ARM64 QA without upload
        run: gradle :app:assembleDebug -Parm64Release=true -PhitmozArm64=true --stacktrace
