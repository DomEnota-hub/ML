name: MediaLoader 1.7.143 Magnetic Lines QA and ARM64 handoff
on:
  push:
    branches:
      - fix/ml-17143-cutout-original-preview-20261106
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-17143-magnetic-lines
  cancel-in-progress: true
jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Magnetic Lines, cutout history, gallery and GAPI regressions
        run: |
          gradle :app:testDebugUnitTest -Parm64Release=true \
            --tests '*MagneticContourTracerTest' \
            --tests '*CutoutMaskEditorTest' \
            --tests '*CutoutViewportTest' \
            --tests '*GalleryBulkAlbumMoveTest' \
            --tests '*GapiKeyStoreTest' \
            --tests '*GapiInstagramProviderTest' --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: Assemble ARM64 1.7.143 Release for local key injection and signature
        run: gradle :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Align and verify ARM64 version
        shell: bash
        run: |
          set -euo pipefail
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          mkdir -p handoff
          test -s "$unsigned"
          "$bt/aapt" dump badging "$unsigned" | grep -F "package: name='com.domenota.medialoader' versionCode='204' versionName='1.7.143'"
          test "$(unzip -Z1 "$unsigned" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = "arm64-v8a"
          "$bt/zipalign" -p -f 4 "$unsigned" handoff/ML_1.7.143_ARM64_ALIGNED_UNSIGNED.apk
          "$bt/zipalign" -c -v 4 handoff/ML_1.7.143_ARM64_ALIGNED_UNSIGNED.apk
          sha256sum handoff/ML_1.7.143_ARM64_ALIGNED_UNSIGNED.apk > handoff/SHA256.txt
      - name: Save unsigned ARM64 handoff (no GAPI credentials, no prerelease)
        uses: actions/upload-artifact@v4
        with:
          name: ml-17143-aligned-unsigned-for-private-signing
          path: handoff/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Save unit and lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-17143-qa-diagnostics
          path: |
            app/build/test-results
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: warn
