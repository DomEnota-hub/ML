name: MediaLoader Gallery Quick Access neutral UI QA
on:
  push:
    branches:
      - feature/ml-gallery-quick-access-neutral-20261107
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-gallery-quick-access-neutral-qa
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gallery shortcuts, albums, navigation, and thumbnail tests
        run: |
          gradle :app:testDebugUnitTest -Parm64Release=true \
            --tests '*GalleryQuickAccessTest' \
            --tests '*GalleryAlbumOrganizationTest' \
            --tests '*GalleryLibraryStateTest' \
            --tests '*GalleryNavigationPlacementTest' \
            --tests '*GalleryViewerStateTest' \
            --tests '*GalleryAlbumFileSortTest' \
            --tests '*GalleryAlbumNavigationTest' \
            --tests '*GalleryViewerPhotoUiTest' \
            --tests '*GapiKeyStoreTest' --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: Compile existing ARM64 Release without secrets or publication
        run: gradle :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Save QA reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-gallery-neutral-ui-qa-reports
          path: |
            app/build/test-results
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: warn
