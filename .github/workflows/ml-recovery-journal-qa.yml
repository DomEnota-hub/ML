name: Historical date replacement scoped QA
on:
  pull_request:
    branches: [feature/ml-17167-recovery-journal-qa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use the Android SDK already installed on the hosted runner
        run: '"$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Recovery and existing history regression gate
        run: >-
          gradle :app:testDebugUnitTest --tests '*HistoricalReferenceLinksTest' --tests '*RecoveryHistoryCasTest'
          :app:assembleRelease -Parm64Release=true --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-recovery-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          retention-days: 7
