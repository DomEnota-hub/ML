name: ML 1.7.197 exact SHA ARM64 unsigned handoff
on:
  push:
    branches: [ci/ml-17197-exact-unsigned-handoff]
permissions:
  contents: read
jobs:
  exact-source-unsigned:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4430da7c5d03082f8036ff68df339f8dd5bac0f3
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify exact candidate and prepare SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4430da7c5d03082f8036ff68df339f8dd5bac0f3"
          grep -Eq 'versionCode 257$' app/build.gradle
          grep -Fq "versionName '1.7.197'" app/build.gradle
          chmod +x gradlew
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for n in 1 2 3 4; do
            ./gradlew --version --no-daemon && break
            test "$n" != 4
            sleep 10
          done
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile ARM64 unsigned release from exact source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease -Parm64Release=true --no-daemon --stacktrace --console=plain
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Align verify package and seal exact sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -p -f 16 app/build/outputs/apk/release/app-release-unsigned.apk handoff/ML_1.7.197_ARM64_ALIGNED_UNSIGNED.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -c -p 16 handoff/ML_1.7.197_ARM64_ALIGNED_UNSIGNED.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging handoff/ML_1.7.197_ARM64_ALIGNED_UNSIGNED.apk | grep -F "package: name='com.domenota.medialoader' versionCode='257' versionName='1.7.197'"
          unzip -Z1 handoff/ML_1.7.197_ARM64_ALIGNED_UNSIGNED.apk | grep -q '^lib/arm64-v8a/'
          if unzip -Z1 handoff/ML_1.7.197_ARM64_ALIGNED_UNSIGNED.apk | grep -Eq '^lib/(armeabi|x86)'; then echo 'Unexpected ABI'; exit 1; fi
          git archive --format=zip --output=handoff/ML_1.7.197_SOURCES_EXACT_COMMIT.zip HEAD
          printf '%s\n' '4430da7c5d03082f8036ff68df339f8dd5bac0f3' > handoff/DELIVERY_COMMIT_SHA.txt
          cd handoff
          sha256sum ML_1.7.197_ARM64_ALIGNED_UNSIGNED.apk ML_1.7.197_SOURCES_EXACT_COMMIT.zip DELIVERY_COMMIT_SHA.txt > UNSIGNED_HANDOFF_SHA256.txt
      - name: Upload unsigned handoff for local GAPI restoration and original signing
        uses: actions/upload-artifact@v4
        with:
          name: ML_1.7.197_EXACT_SHA_UNSIGNED_HANDOFF
          path: handoff/
          retention-days: 7
          if-no-files-found: error
