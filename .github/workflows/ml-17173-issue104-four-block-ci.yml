name: ML Issue 104 - four block continuous QA (no releases)
on:
  push:
    branches:
      - feature/ml-17173-issue104-four-blocks-20261111
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-issue104-four-blocks-validation
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle / SDK35
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4; do
            ./gradlew --version --no-daemon && break
            test "$i" != 4
            sleep 10
          done
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify app version and no signing or release job
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "versionName '1.7.173'" app/build.gradle
          grep -Fq "applicationId 'com.domenota.medialoader'" app/build.gradle
      - name: Focused regression tests for all four blocks
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest -Parm64Release=true \
            --tests '*GlyphContentMaskTest' \
            --tests '*PersonContourOverlayTest' \
            --tests '*PersonInstancePolicyTest' \
            --tests '*PersonSegmentationPipelineTest' \
            --tests '*PersonManualRefinementMaskTest' \
            --tests '*AiPrismMotionTest' \
            --tests '*UnifiedMaskOverlayTest' \
            --tests '*GalleryVideoChromeTest' \
            --tests '*GalleryViewerOverlayPolicyTest' \
            --tests '*MusicFavoritesPolicyTest' \
            --tests '*BulkOutcomeCountsTest' \
            --tests '*BulkLogicTest' \
            --tests '*InpaintingContractsTest' \
            --tests '*LaMaCompositionTest' \
            --tests '*LocalTextOcrFallbackTest' \
            --stacktrace
      - name: ARM64 compile only (unsigned, NO APK artifact/release)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease -Parm64Release=true --stacktrace
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          test "$(unzip -Z1 "$apk" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "versionName='1.7.173'"
      - name: Full JVM regression suite (fatal; legacy UI tests included)
        run: ./gradlew :app:testDebugUnitTest -Parm64Release=true --stacktrace
      - name: Android lint (fatal; always report even if legacy tests fail)
        if: always()
        run: ./gradlew :app:lintDebug -Parm64Release=true --stacktrace
      - name: Retain diagnostic reports only (NO APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue104-test-and-lint-diagnostics
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 3
