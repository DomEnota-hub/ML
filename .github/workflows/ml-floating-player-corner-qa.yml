name: MediaLoader floating player fullscreen button QA
on:
  push:
    branches:
      - fix/ml-floating-player-expand-bottom-right-20261106
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-floating-player-corner-qa
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Floating window, seekbar and video player regressions
        run: |
          gradle :app:testDebugUnitTest -Parm64Release=true \
            --tests '*FloatingVideoControlPlacementTest' \
            --tests '*FloatingVideoGesturePolicyTest' \
            --tests '*FloatingVideoSeekBarTest' \
            --tests '*FloatingVideoSeekPolicyTest' \
            --tests '*VideoPlayerUiPolicyTest' --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: ARM64 compile check, no publication or signing
        run: gradle :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Save QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-floating-player-corner-diagnostics
          path: |
            app/build/test-results
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: warn
