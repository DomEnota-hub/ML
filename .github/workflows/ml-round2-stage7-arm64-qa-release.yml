name: MediaLoader Round 2 Stage 7 ARM64 QA Release
on:
  push:
    branches:
      - integration/ml-round2-7-stages-arm64-20261101
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ml-round2-stage7-qa
  cancel-in-progress: false

jobs:
  integrated-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: qa-round2-1.7.110-20261101
      RELEASE_ASSET: MediaLoader-1.7.110-Round2-ARM64-QA.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Full integrated unit tests
        run: gradle :app:testDebugUnitTest -Parm64Release=true --stacktrace
      - name: Android Lint
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: ARM64 isolated QA build
        run: gradle :app:assembleDebug -Parm64Release=true -PhitmozArm64=true --stacktrace
      - name: Verify QA package, signing and native ABI
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" |
            grep "package: name='com.domenota.medialoader.hitmoz'"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-entries.txt"
          grep -E '^lib/arm64-v8a/.*\.so$' "$RUNNER_TEMP/apk-entries.txt" >/dev/null
          if grep -E '^lib/(armeabi-v7a|x86|x86_64)/' "$RUNNER_TEMP/apk-entries.txt"; then
            echo "Non-ARM64 libraries detected" >&2
            exit 1
          fi
          sha256sum "$apk"
      - name: Archive one short-lived build for CI
        uses: actions/upload-artifact@v4
        with:
          name: ML-1.7.110-Round2-ARM64-QA
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Publish verified GitHub QA prerelease
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          cp "$apk" "$RUNNER_TEMP/$RELEASE_ASSET"
          checksum=$(sha256sum "$RUNNER_TEMP/$RELEASE_ASSET" | cut -d' ' -f1)
          cat > "$RUNNER_TEMP/qa-notes.md" <<EOF
          **MediaLoader 1.7.110 / тестовый раунд исправлений №2, этапы 1–7.**

          - Состояние галереи: возврат к месту просмотра, ограничение Android SavedState, снижение частоты повторных сканирований
          - Фото: предпросмотр, отмена вычислений, геометрия ±, линейка с нулём, перемещение рамки
          - Рисование: локальное стирание, визуальный размер кисти, раскрытие настроек
          - Уровни: нулевая отметка, RGB-кривые, новые пресеты; расположение панелей
          - Видео: только адаптивная компоновка, без изменений алгоритмов монтажа

          **Это отдельная ARM64 debug QA-сборка, не производственный релиз.** Пакет com.domenota.medialoader.hitmoz и отладочная подпись. Приложение DomEnota остаётся установленным отдельно.

          SHA-256: $checksum
          Исходники: https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA
          CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$RELEASE_ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/$RELEASE_ASSET" \
              --target "$GITHUB_SHA" --title "MediaLoader 1.7.110 · Round 2 QA · ARM64" \
              --notes-file "$RUNNER_TEMP/qa-notes.md" --prerelease --repo "$GITHUB_REPOSITORY"
          fi
          mkdir -p "$RUNNER_TEMP/verify"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$RELEASE_ASSET" --dir "$RUNNER_TEMP/verify"
          echo "$checksum  $RUNNER_TEMP/verify/$RELEASE_ASSET" | sha256sum --check --status
      - name: Rotate only older QA prereleases after verified publication
        shell: bash
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and ((.tagName | startswith("qa-photo-")) or (.tagName | startswith("qa-round2-")))) | .tagName' \
            > "$RUNNER_TEMP/qa-tags.txt"
          while IFS= read -r old; do
            if [[ -n "$old" && "$old" != "$RELEASE_TAG" ]]; then
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
          done < "$RUNNER_TEMP/qa-tags.txt"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
