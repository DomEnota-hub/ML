name: MediaLoader Round 2 Stage 7 ARM64 Integration QA
on:
  push:
    branches:
      - integration/ml-round2-7-stages-arm64-20261101
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-round2-stage7-integration-qa
  cancel-in-progress: false

jobs:
  integrated-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Full integrated unit tests
        run: gradle :app:testDebugUnitTest -Parm64Release=true --stacktrace
      - name: Android Lint
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: ARM64 isolated QA build
        run: gradle :app:assembleDebug -Parm64Release=true -PhitmozArm64=true --stacktrace
      - name: Verify QA package, signing and native ABI
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" |
            grep "package: name='com.domenota.medialoader.hitmoz'"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-entries.txt"
          grep -E '^lib/arm64-v8a/.*\.so$' "$RUNNER_TEMP/apk-entries.txt" >/dev/null
          if grep -E '^lib/(armeabi-v7a|x86|x86_64)/' "$RUNNER_TEMP/apk-entries.txt"; then
            echo "Non-ARM64 libraries detected" >&2
            exit 1
          fi
          sha256sum "$apk"
      - name: Archive one short-lived build for CI
        uses: actions/upload-artifact@v4
        with:
          name: ML-1.7.110-Round2-ARM64-QA
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
