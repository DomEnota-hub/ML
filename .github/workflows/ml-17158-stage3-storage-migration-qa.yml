name: ML stage 3 - Pictures migration and history integrity QA

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-17158-stage3-storage-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  storage-and-regression:
    if: github.head_ref != 'feature/ml-17168-dated-replacement'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bootstrap verified Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4; do
            ./gradlew --version --no-daemon && break
            test "$i" != 4
            sleep 10
          done
      - name: SDK 35
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0'
      - name: Pictures destination, history and OCR regression tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest -Parm64Release=true \
            --tests '*MediaStoragePolicyTest' \
            --tests '*StorageSettingsPicturesTest' \
            --tests '*LegacyMediaMigrationHistoryTest' \
            --tests '*StorageNamingTest' \
            --tests '*DownloadQueueTest' \
            --tests '*GalleryLibraryStateTest' \
            --tests '*LocalTextOcrFallbackTest' \
            --tests '*TextGlyphMaskTest' \
            --tests '*GlyphContentMaskTest' \
            --tests '*PersonInstancePolicyTest' \
            --tests '*LaMaCompositionTest' \
            --stacktrace
      - name: Android lint
        run: ./gradlew :app:lintDebug -Parm64Release=true --stacktrace
      - name: Unsigned ARM64 Release compilation
        run: ./gradlew :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Verify resulting APK and destination source checks
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$bt/aapt" dump badging "$apk" | grep -F "name='com.domenota.medialoader'"
          test "$(unzip -Z1 "$apk" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = "arm64-v8a"
          grep -q 'MediaStore.Images.Media.EXTERNAL_CONTENT_URI' app/src/main/java/com/domenota/medialoader/data/storage/StorageManager.kt
          grep -q 'MediaStore.Video.Media.EXTERNAL_CONTENT_URI' app/src/main/java/com/domenota/medialoader/data/storage/StorageManager.kt
          grep -q 'moveSavedUriWhenCurrent' app/src/main/java/com/domenota/medialoader/core/database/HistoryDatabase.kt
          ! grep -q 'moveSavedUriWhenCurrent' app/src/main/java/com/domenota/medialoader/data/storage/LegacyMediaMigration.kt
          grep -q 'storageMigrationRunning' app/src/main/java/com/domenota/medialoader/ui/screens/SettingsScreen.kt
          sha256sum "$apk"
      - name: Save diagnostics only
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ml17158-stage3-storage-diagnostics
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 3
