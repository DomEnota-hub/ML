name: ML 1.7.110 ARM64 signed DomEnota handoff

on:
  push:
    branches:
      - release/ml-1.7.110-video-editor-arm64
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-1-7-110-signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK build tools
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build ML 1.7.110 production ARM64
        run: gradle :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Sign with existing DomEnota key and verify upgrade certificate
        shell: bash
        env:
          ML_RELEASE_KEYSTORE_BASE64: ${{ secrets.ML_RELEASE_KEYSTORE_BASE64 }}
          ML_RELEASE_STORE_PASSWORD: ${{ secrets.ML_RELEASE_STORE_PASSWORD }}
          ML_RELEASE_KEY_ALIAS: ${{ secrets.ML_RELEASE_KEY_ALIAS }}
          ML_RELEASE_KEY_PASSWORD: ${{ secrets.ML_RELEASE_KEY_PASSWORD }}
          ML_RELEASE_SIGNER_SHA256: ${{ secrets.ML_RELEASE_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          for name in ML_RELEASE_KEYSTORE_BASE64 ML_RELEASE_STORE_PASSWORD ML_RELEASE_KEY_ALIAS ML_RELEASE_KEY_PASSWORD ML_RELEASE_SIGNER_SHA256; do
            if test -z "${!name:-}"; then
              echo "::error::Missing required protected signing secret: $name"
              exit 1
            fi
          done
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          "$bt/aapt" dump badging "$unsigned" |
            grep -F "package: name='com.domenota.medialoader' versionCode='172' versionName='1.7.110'"
          test "$(unzip -Z1 "$unsigned" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
          key="$RUNNER_TEMP/ml-release-keystore.jks"
          aligned="$RUNNER_TEMP/ML-aligned.apk"
          mkdir -p signed-output
          signed="signed-output/ML_1.7.110_ARM64_DomEnota_SIGNED.apk"
          trap 'rm -f "$key" "$aligned"' EXIT
          printf '%s' "$ML_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          "$bt/zipalign" -p -f 4 "$unsigned" "$aligned"
          "$bt/apksigner" sign \
            --min-sdk-version 26 \
            --ks "$key" \
            --ks-key-alias "$ML_RELEASE_KEY_ALIAS" \
            --ks-pass env:ML_RELEASE_STORE_PASSWORD \
            --key-pass env:ML_RELEASE_KEY_PASSWORD \
            --out "$signed" "$aligned"
          "$bt/apksigner" verify --verbose "$signed"
          cert=$("$bt/apksigner" verify --print-certs "$signed" |
            sed -nE 's/^Signer #1 certificate SHA-256 digest: ([0-9a-fA-F:]+).*$/\1/p' |
            head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')
          expected=$(printf '%s' "$ML_RELEASE_SIGNER_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ': ')
          # The previous ML 1.7.109 APK and the user's original JKS have this exact certificate.
          previous=4f6f0ddf4d8fd2669fd2a3a6ebab6e84bda17281a3a5badada0e1eeb73a4f1d2
          if test -z "$cert" || test "$cert" != "$expected" || test "$cert" != "$previous"; then
            echo "::error::Signing certificate mismatch: refusing to publish incompatible APK"
            rm -f "$signed"
            exit 1
          fi
          "$bt/aapt" dump badging "$signed" |
            grep -F "package: name='com.domenota.medialoader' versionCode='172' versionName='1.7.110'"
          test "$(unzip -Z1 "$signed" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
          (cd signed-output && sha256sum ML_1.7.110_ARM64_DomEnota_SIGNED.apk > ML_1.7.110_SIGNED_SHA256.txt)
          echo "Signed package uses unchanged ML update certificate; no public GitHub Release created."
      - name: Upload private signed APK for ChatGPT Library handoff
        uses: actions/upload-artifact@v4
        with:
          name: ML-1.7.110-ARM64-DomEnota-SIGNED
          path: signed-output/
          if-no-files-found: error
          retention-days: 2
