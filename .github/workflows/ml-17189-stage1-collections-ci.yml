name: ML 1.7.195 projection stability QA and unsigned handoff
on:
  push:
    branches: [feature/ml-17195-projection-stability]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      final_acceptance:
        description: Run full final acceptance and unsigned handoff (stage 3)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ml-17195-collections-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  collections:
    if: github.event_name != 'pull_request' || github.head_ref == 'feature/ml-17195-projection-stability'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle and SDK
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for n in 1 2 3 4; do
            ./gradlew --version --no-daemon && break
            test "$n" != 4
            sleep 10
          done
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify identity and UI guards
        run: |
          grep -Eq 'versionCode 255$' app/build.gradle
          grep -Fq "versionName '1.7.195'" app/build.gradle
          python3 scripts/audit_ui_palette.py
          python3 scripts/check-round-sliders.py
          python3 scripts/check-in-app-notices.py
      - name: Folder visibility and durable membership regressions
        run: |
          ./gradlew :app:testDebugUnitTest -Parm64Release=true --tests '*Visibility*Test' --tests '*HiddenFolderFileStoreTest' --tests '*DownloadCatalogSelectionTest' --tests '*GalleryLibraryStateTest' --stacktrace
          mkdir -p app/build/ml-jvm-shards/stage1-visibility
          cp app/build/test-results/testDebugUnitTest/TEST-*.xml app/build/ml-jvm-shards/stage1-visibility/
      - name: Stage 1 performance, privacy, navigation and logging regressions
        if: inputs.final_acceptance != true
        run: |
          ./gradlew :app:testDebugUnitTest -Parm64Release=true --tests '*BackgroundLibraryProjectionTest' --tests '*LibraryDisplayInventoryTest' --tests '*GalleryBrowseInventoryTest' --tests '*MusicBrowseProjectionTest' --tests '*LibraryProjectionCountersTest' --tests '*LibraryWorkCountersTest' --tests '*ResumeQueue*Test' --tests '*AudioQueuePlaybackTest' --tests '*AudioPlaybackMetadata*Test' --tests '*ListeningHistory*Test' --tests '*PrivatePlayback*Test' --tests '*LibraryAudioQueueTest' --tests '*GridMediaQueueTest' --tests '*PrivateViewerQueueTest' --tests '*ViewerQueueInventoryTest' --tests '*ViewerQueueCacheTest' --tests '*StableLibraryNavHostTest' --tests '*LibraryReturnNavigationTest' --tests '*GalleryDate*Test' --tests '*PhoneMediaLibraryTest' --tests '*PhoneLibraryCacheTest' --tests '*LibraryValidationGateTest' --tests '*LogDisplayTest' --tests '*AppLogAsyncTest' --tests '*BoundedLogWriterTest' --tests '*PerfWorkCountersTest' --tests '*VisualDuplicate*Test' --stacktrace
      - name: Collection regression tests
        if: inputs.final_acceptance == true
        run: |
          python3 scripts/run-jvm-isolated-compose.py collection --tests '*Collection*Test' --tests '*MediaOrganization*Test' --tests '*PhoneLibraryCacheTest' --tests '*GalleryViewerPhotoUiTest' --tests '*GalleryViewerStateTest' --tests '*BackgroundLibraryProjectionTest' --tests '*LibraryDisplayInventoryTest' --tests '*GalleryBrowseInventoryTest' --tests '*LibraryProjectionCountersTest' --tests '*AudioThumbnailInvalidationTest' --tests '*AppAudioIdentityCacheTest'
      - name: Duplicate scan and acoustic regressions
        if: inputs.final_acceptance == true
        run: |
          ./gradlew :app:testDebugUnitTest -Parm64Release=true --tests '*Acoustic*Test' --tests '*Duplicate*Test' --tests '*Waveform*Test' --stacktrace
      - name: Music folders, daily history and recognition regressions
        if: inputs.final_acceptance == true
        run: |
          python3 scripts/run-jvm-isolated-compose.py music --tests '*RecentMusic*Test' --tests '*MusicScanModeControlsTest' --tests '*MusicFolder*Test' --tests '*MusicPlayerControls*Test' --tests '*MusicOverviewUiTest' --tests '*CompactAudioSeekTest' --tests '*ListeningHistory*Test' --tests '*SmartMusic*Test' --tests '*SmartStatsInterval*Test' --tests '*Recognition*Test' --tests '*DirectMp3TagsTest' --tests '*Mp3TagArgumentsTest' --tests '*AudioReplace*Test' --tests '*AudioPlaybackMetadata*Test' --tests '*PlaybackDurationStateTest' --tests '*MediaWriteAccessTest' --tests '*InstagramPublicationMusicTest' --tests '*ResumeQueue*Test' --tests '*PreviousTrackPolicyTest' --tests '*AudioQueuePlaybackTest' --tests '*MusicBrowseProjectionTest' --tests '*LibraryModeScreensTest' --tests '*PrivatePlayback*Test' --tests '*LibraryWorkCountersTest'
      - name: Shared photo editor, full resolution and drawing regressions
        if: inputs.final_acceptance == true
        run: |
          ./gradlew :app:testDebugUnitTest -Parm64Release=true --tests '*Photo*Test' --tests '*BatchWatermarkTest' --tests '*BatchTextDraftRestorationTest' --tests '*TextLayer*Test' --tests '*EditorTextDialogLayoutTest' --stacktrace
      - name: Video editor filters and viewer regressions
        if: inputs.final_acceptance == true
        run: |
          ./gradlew :app:testDebugUnitTest -Parm64Release=true --tests '*Video*Test' --tests '*GalleryStage5ViewerTest' --tests '*GalleryViewer*Test' --tests '*PrivateViewerChromeTest' --tests '*EditorPaletteTest' --stacktrace
      - name: Missing file restoration and deferred routing regressions
        if: inputs.final_acceptance == true
        run: |
          ./gradlew :app:testDebugUnitTest -Parm64Release=true --tests '*MissingFileRecovery*Test' --tests '*MissingRecovery*Test' --tests '*DeferredLinkStoreTest' --tests '*DownloadQueueTest' --tests '*RecoveryHistoryCasTest' --tests '*SavedFilePresenceTest' --stacktrace
      - name: In-app notices and Instagram mode regression tests
        if: inputs.final_acceptance == true
        run: |
          ./gradlew :app:testDebugUnitTest -Parm64Release=true --tests '*NoticePolicyTest' --tests '*AppNoticeControllerTest' --tests '*NoticeCardInteractionTest' --tests '*InstagramModeToggleTest' --tests '*InstagramShareRoutingTest' --tests '*PreviewMusicActionTest' --tests '*DownloadsGroupActionsUiTest' --tests '*HistorySwipeActionTest' --tests '*CatalogFavoriteBatchTest' --stacktrace
      - name: File name display and settings palette regressions
        if: inputs.final_acceptance == true
        run: |
          ./gradlew :app:testDebugUnitTest -Parm64Release=true --tests '*FileNameDisplay*Test' --tests '*SettingsIconPaletteTest' --stacktrace
      - name: OCR masks and native model lifecycle regressions
        if: inputs.final_acceptance == true
        run: |
          ./gradlew :app:testDebugUnitTest -Parm64Release=true --tests '*LocalTextOcrFallbackTest' --tests '*OcrLineCandidatePolicyTest' --tests '*GlyphContentMaskTest' --tests '*OutlinedGlyphInkTest' --tests '*TextGlyphMaskTest' --tests '*SerializedModelCacheTest' --tests '*LaMaCompositionTest' --tests '*LaMaInputSamplingEquivalenceTest' --tests '*MobileSamLaMaIntegrationTest' --stacktrace
      - name: Full JVM suite
        if: inputs.final_acceptance == true
        run: python3 scripts/run-jvm-isolated-compose.py full
      - name: Android lint
        if: inputs.final_acceptance == true
        run: ./gradlew :app:lintDebug -Parm64Release=true --stacktrace
      - name: Internal ARM64 compilation (no distribution)
        if: inputs.final_acceptance == true
        run: ./gradlew :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Validate final APK and prepare exact-commit unsigned handoff
        if: success() && inputs.final_acceptance == true
        shell: bash
        run: |
          set -euo pipefail
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          input=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$input"
          "$bt/aapt" dump badging "$input" | grep -F "package: name='com.domenota.medialoader' versionCode='255' versionName='1.7.195'"
          test "$(unzip -Z1 "$input" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
          mkdir -p handoff/tools handoff/source
          aligned=handoff/ML_1.7.195_ARM64_ALIGNED_UNSIGNED.apk
          "$bt/zipalign" -P 16 -f 4 "$input" "$aligned"
          "$bt/zipalign" -c -P 16 -v 4 "$aligned"
          cp "$bt/lib/apksigner.jar" handoff/tools/apksigner.jar
          cp "$bt/zipalign" "$bt/aapt" handoff/tools/
          if [ -d "$bt/lib64" ]; then cp -r "$bt/lib64" handoff/tools/; fi
          git archive --format=zip -o handoff/source/ML_1.7.195_SOURCES_EXACT_COMMIT.zip HEAD
          git rev-parse HEAD > handoff/source/DELIVERY_COMMIT_SHA.txt
          (cd handoff && find . -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/ml189-handoff-sha256.txt)
          cp /tmp/ml189-handoff-sha256.txt handoff/UNSIGNED_HANDOFF_SHA256.txt
      - name: Temporary unsigned handoff for local signing (not a release)
        if: success() && inputs.final_acceptance == true
        uses: actions/upload-artifact@v4
        with:
          name: ML_1.7.195_PRIVATE_UNSIGNED_LOCAL_SIGNING
          path: handoff/
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
      - name: Save diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml17195-collections-diagnostics
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/ml-jvm-shards/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 3
