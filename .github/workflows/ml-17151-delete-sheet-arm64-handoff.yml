name: MediaLoader 1.7.151 deletion & fullscreen panels ARM64 handoff
on:
  push:
    branches:
      - release/ml-17151-delete-sheet-20261108
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-17151-delete-sheet-and-systembars
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Deletion, system bars, photo and video viewer regression tests
        run: |
          gradle :app:testDebugUnitTest -Parm64Release=true \
            --tests '*LibraryMediaDeleteSheetTest' \
            --tests '*MediaDeletionPolicyTest' \
            --tests '*DeleteConfirmationTest' \
            --tests '*PermanentMediaDeletionTest' \
            --tests '*PhoneMediaTrashTest' \
            --tests '*GalleryMultipleSelectionTest' \
            --tests '*GalleryViewerPhotoUiTest' \
            --tests '*GalleryViewerOverlayPolicyTest' \
            --tests '*GalleryViewerStateTest' \
            --tests '*GalleryQuickAccessTest' \
            --tests '*GalleryNavigationPlacementTest' \
            --tests '*FullscreenOrientationTest' \
            --tests '*VideoGesturePolicyTest' \
            --tests '*GapiKeyStoreTest' --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: Build unsigned ARM64 Release APK
        run: gradle :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Verify version, ARM64 and zipalign
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -s "$apk"
          "$bt/aapt" dump badging "$apk" | grep -F "package: name='com.domenota.medialoader' versionCode='212' versionName='1.7.151'"
          test "$(unzip -Z1 "$apk" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = "arm64-v8a"
          mkdir -p handoff
          "$bt/zipalign" -p -f 4 "$apk" handoff/ML_1.7.151_ARM64_ALIGNED_UNSIGNED.apk
          "$bt/zipalign" -c -v 4 handoff/ML_1.7.151_ARM64_ALIGNED_UNSIGNED.apk
          sha256sum handoff/ML_1.7.151_ARM64_ALIGNED_UNSIGNED.apk > handoff/ALIGNED_UNSIGNED_SHA256.txt
      - name: Keep unsigned ARM64 APK for private offline signing
        uses: actions/upload-artifact@v4
        with:
          name: ml-17151-arm64-unsigned-private-signing
          path: handoff/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Retain QA test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-17151-qa-diagnostics
          path: |
            app/build/test-results
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: warn
