name: ML 1.7.177 track equalizer and caption recovery
on:
  push:
    branches:
      - feature/ml-17177-track-eq-caption-recovery-20261112
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-17177-track-eq-caption
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle and SDK
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for n in 1 2 3 4; do
            ./gradlew --version --no-daemon && break
            test "$n" != 4
            sleep 10
          done
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate exact app identity
        run: |
          grep -Eq 'versionCode 237$' app/build.gradle
          grep -Fq "versionName '1.7.177'" app/build.gradle
          grep -Fq "applicationId 'com.domenota.medialoader'" app/build.gradle
      - name: Focused EQ, Instagram, vault viewer and AI regression tests
        run: |
          ./gradlew :app:testDebugUnitTest -Parm64Release=true \
            --tests '*Equalizer*Test' \
            --tests '*AudioPlaybackMetadataTest' \
            --tests '*AudioQueuePlaybackTest' \
            --tests '*AudioPlaybackModesTest' \
            --tests '*PrivatePlaybackPolicyTest' \
            --tests '*PrivatePlaybackAliasTest' \
            --tests '*HiddenMusicPreviewTest' \
            --tests '*MusicTrackVisibilityTest' \
            --tests '*InstagramProviderTest' \
            --tests '*InstagramApiFailureTest' \
            --tests '*GapiInstagramClientTest' \
            --tests '*GapiInstagramProviderTest' \
            --tests '*StorageNamingTest' \
            --tests '*PrivateViewerQueueTest' \
            --tests '*PrivateViewerChromeTest' \
            --tests '*GalleryViewerStateTest' \
            --tests '*OcrLineCandidatePolicyTest' \
            --tests '*GlyphContentMaskTest' \
            --tests '*LocalTextOcrFallbackTest' \
            --tests '*LaMaCompositionTest' \
            --tests '*LargePersonBackgroundRecoveryTest' \
            --stacktrace
      - name: Full JVM suite
        run: ./gradlew :app:testDebugUnitTest -Parm64Release=true --stacktrace
      - name: Android lint
        if: success()
        run: ./gradlew :app:lintDebug -Parm64Release=true --stacktrace
      - name: ARM64 release compilation
        if: success()
        run: |
          ./gradlew :app:assembleRelease -Parm64Release=true --stacktrace
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test "$(unzip -Z1 app/build/outputs/apk/release/app-release-unsigned.apk | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
