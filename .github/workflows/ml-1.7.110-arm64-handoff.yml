name: ML 1.7.110 ARM64 final build handoff
on:
  push:
    branches:
      - release/ml-1.7.110-video-editor-arm64
  workflow_dispatch:

concurrency:
  group: ml-1.7.110-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ml-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: WebView sources
        run: |
          node scripts/test-youtube-thumbnail.cjs
          node scripts/test-hitmoz-native-script.cjs
          node scripts/test-muzmo-native-script.cjs
      - name: Full tests and lint
        run: gradle :app:testDebugUnitTest :app:lintDebug -Parm64Release=true --stacktrace
      - name: ARM64 production release and separate testable preview
        run: |
          gradle :app:assembleRelease -Parm64Release=true --stacktrace
          gradle :app:assembleDebug -PhitmozArm64=true --stacktrace
      - name: Verify package identity, ABI, version and signing
        shell: bash
        run: |
          set -euo pipefail
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          release=app/build/outputs/apk/release/app-release-unsigned.apk
          debug=app/build/outputs/apk/debug/app-debug.apk
          test -s "$release" && test -s "$debug"
          "$bt/aapt" dump badging "$release" | grep -F "package: name='com.domenota.medialoader' versionCode='172' versionName='1.7.110'"
          "$bt/aapt" dump badging "$debug" | grep -F "package: name='com.domenota.medialoader.hitmoz'"
          for apk in "$release" "$debug"; do
            test "$(unzip -Z1 "$apk" | awk -F/ '$1=="lib" { print $2 }' | sort -u)" = arm64-v8a
          done
          if "$bt/apksigner" verify "$release" >/dev/null 2>&1; then
            echo "::error::Release APK must be unsigned for local DomEnota signing"
            exit 1
          fi
          "$bt/apksigner" verify "$debug"
          echo "Production release is unsigned; QA preview is test-signed and has different application ID."
      - name: Preserve APKs for signing and Library upload
        shell: bash
        run: |
          mkdir -p ml-output
          cp app/build/outputs/apk/release/app-release-unsigned.apk ml-output/ML_1.7.110_ARM64_UNSIGNED.apk
          cp app/build/outputs/apk/debug/app-debug.apk ml-output/ML_1.7.110_ARM64_QA_DEBUG.apk
          (cd ml-output && sha256sum ./*.apk > sha256.txt)
          ls -lh ml-output/
      - name: Upload ML 1.7.110 ARM64 handoff
        uses: actions/upload-artifact@v4
        with:
          name: ML-1.7.110-ARM64-build-handoff
          path: ml-output/
          if-no-files-found: error
          retention-days: 2
