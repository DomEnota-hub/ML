name: ML photo editor integrated validation and dual-theme icon palette
on:
  push:
    branches:
      - feature/ml-photo-editor-final-theme-20261031
  workflow_dispatch:
concurrency:
  group: ml-photo-editor-integrated-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  integrated-android-check:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Full test suite including all six photo stages and theme palettes
        run: gradle :app:testDebugUnitTest -Parm64Release=true --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: Build ARM64 debug without publishing an unreviewed APK
        run: gradle :app:assembleDebug -Parm64Release=true --stacktrace
