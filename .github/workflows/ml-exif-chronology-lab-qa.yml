name: ML 1.7.162 EXIF one-copy and recovery lab QA
on:
  push:
    branches:
      - feature/ml-exif-chronology-lab-20261110
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-exif-chronology-lab-qa
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle and Android 35
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for n in 1 2 3 4; do
            ./gradlew --version --no-daemon && break
            test "$n" != 4
            sleep 10
          done
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify 1.7.162 and isolated EXIF trial
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'versionCode 222$' app/build.gradle
          grep -Fq "versionName '1.7.162'" app/build.gradle
          grep -Fq "applicationId 'com.domenota.medialoader'" app/build.gradle
          trial=app/src/main/java/com/domenota/medialoader/data/storage/MediaExifChronologyTrial.kt
          settings=app/src/main/java/com/domenota/medialoader/ui/screens/SettingsScreen.kt
          lab=app/src/main/java/com/domenota/medialoader/ui/screens/MediaRecoveryLabSection.kt
          test -s "$trial" && test -s "$lab"
          grep -Fq 'Pictures/MediaLoader_QA_EXIF_Test/' "$trial"
          grep -Fq 'MediaRecoveryLabSection(' "$settings"
          grep -Fq 'Восстановление медиатеки' "$lab"
          if grep -Eq 'resolver\.delete\(source|resolver\.update\(source|dao\.(delete|update)|moveSavedUriWhenCurrent|put\([^)]*DATE_ADDED' "$trial"; then
            echo "::error::EXIF trial must never mutate originals or write DATE_ADDED"
            exit 1
          fi
          if sed -n '/SettingRow(Icons.Rounded.Download, "Загрузка"/,/Text("Музыка"/p' "$settings" | grep -Eq 'Проба обратного создания файлов|Восстановление исходных дат|Проверить даты системной галереи'; then
            echo "::error::Temporary recovery controls must be outside Download settings"
            exit 1
          fi
      - name: EXIF and chronology regression tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest -Parm64Release=true \
            --tests '*ExifTrialPolicyTest' \
            --tests '*RepublishTrialPolicyTest' \
            --tests '*MediaStoreDateAuditPolicyTest' \
            --tests '*PhoneLibraryChronologyTest' \
            --tests '*MediaDateRepairPolicyTest' \
            --tests '*LegacyRelocationPolicyTest' \
            --tests '*MediaStoragePolicyTest' \
            --tests '*GalleryLibraryStateTest' \
            --tests '*GalleryAlbumFileSortTest' \
            --tests '*GalleryDateNavigationTest' \
            --tests '*PhoneMediaLibraryTest' --stacktrace
      - name: Android lint
        run: ./gradlew :app:lintDebug -Parm64Release=true --stacktrace
      - name: ARM64 unsigned release
        run: ./gradlew :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Verify ARM64 and create signing handoff
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -s "$apk"
          test "$(unzip -Z1 "$apk" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
          "$bt/aapt" dump badging "$apk" | grep -F "package: name='com.domenota.medialoader' versionCode='222' versionName='1.7.162'"
          mkdir -p handoff/tools/lib handoff/tools/lib64
          "$bt/zipalign" -p -f 4 "$apk" handoff/ML_1.7.162_ARM64_ALIGNED_UNSIGNED.apk
          "$bt/zipalign" -c -v 4 handoff/ML_1.7.162_ARM64_ALIGNED_UNSIGNED.apk
          cp "$bt/zipalign" handoff/tools/
          cp "$bt/lib/apksigner.jar" handoff/tools/lib/
          cp -a "$bt/lib64/." handoff/tools/lib64/
          git archive --format=zip -o handoff/ML_1.7.162_SOURCES_EXACT_COMMIT.zip HEAD
          git rev-parse HEAD > handoff/COMMIT_SHA.txt
          (cd handoff && sha256sum ML_1.7.162_ARM64_ALIGNED_UNSIGNED.apk ML_1.7.162_SOURCES_EXACT_COMMIT.zip tools/lib/apksigner.jar > VERIFIED_SHA256.txt)
      - name: One-day private local signing artifact
        uses: actions/upload-artifact@v4
        with:
          name: ML_1.7.162_verified_unsigned_sources_local_signing
          path: handoff/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
