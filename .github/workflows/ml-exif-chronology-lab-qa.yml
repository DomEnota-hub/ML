name: ML EXIF single-copy and media recovery lab QA
on:
  push:
    branches:
      - feature/ml-exif-chronology-lab-20261110
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-exif-chronology-lab-qa
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle and Android 35
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for n in 1 2 3 4; do
            ./gradlew --version --no-daemon && break
            test "$n" != 4
            sleep 10
          done
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify EXIF trial and temporary section isolation
        shell: bash
        run: |
          set -euo pipefail
          trial=app/src/main/java/com/domenota/medialoader/data/storage/MediaExifChronologyTrial.kt
          settings=app/src/main/java/com/domenota/medialoader/ui/screens/SettingsScreen.kt
          lab=app/src/main/java/com/domenota/medialoader/ui/screens/MediaRecoveryLabSection.kt
          test -s "$trial" && test -s "$lab"
          grep -Fq 'Pictures/MediaLoader_QA_EXIF_Test/' "$trial"
          grep -Fq 'MediaRecoveryLabSection(' "$settings"
          grep -Fq 'Восстановление медиатеки' "$lab"
          if grep -Eq 'resolver\.delete\(source|resolver\.update\(source|dao\.(delete|update)|moveSavedUriWhenCurrent|put\\([^)]*DATE_ADDED' "$trial"; then
            echo "::error::EXIF one-copy trial must never change originals or real insertion timestamps"
            exit 1
          fi
          if sed -n '/SettingRow(Icons.Rounded.Download, "Загрузка"/,/Text("Музыка"/p' "$settings" | grep -Eq 'Проба обратного создания файлов|Восстановление исходных дат|Проверить даты системной галереи'; then
            echo "::error::Temporary lab controls must not be in Download settings"
            exit 1
          fi
      - name: EXIF fail-closed, chronology and old migration regression tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest -Parm64Release=true \
            --tests '*ExifTrialPolicyTest' \
            --tests '*RepublishTrialPolicyTest' \
            --tests '*MediaStoreDateAuditPolicyTest' \
            --tests '*PhoneLibraryChronologyTest' \
            --tests '*MediaDateRepairPolicyTest' \
            --tests '*LegacyRelocationPolicyTest' \
            --tests '*MediaStoragePolicyTest' \
            --tests '*GalleryLibraryStateTest' --stacktrace
      - name: Android lint
        run: ./gradlew :app:lintDebug -Parm64Release=true --stacktrace
      - name: ARM64 unsigned release compile
        run: ./gradlew :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Verify ARM64 package
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          test "$(unzip -Z1 "$apk" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
