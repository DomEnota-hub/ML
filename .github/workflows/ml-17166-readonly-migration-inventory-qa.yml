name: ML 1.7.166 read-only migration inventory QA
on:
  push:
    branches:
      - feature/ml-17166-readonly-migration-inventory
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-17166-readonly-migration-inventory-qa
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle and Android 35
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for n in 1 2 3 4; do
            ./gradlew --version --no-daemon && break
            test "$n" != 4
            sleep 10
          done
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enforce exact version and read-only audit boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'versionCode 226$' app/build.gradle
          grep -Fq "versionName '1.7.166'" app/build.gradle
          grep -Fq "applicationId 'com.domenota.medialoader'" app/build.gradle
          audit=app/src/main/java/com/domenota/medialoader/data/storage/MediaMigrationReadOnlyInventory.kt
          policy=app/src/main/java/com/domenota/medialoader/data/storage/MigrationPreflightPolicy.kt
          lab=app/src/main/java/com/domenota/medialoader/ui/screens/MediaRecoveryLabSection.kt
          test -s "$audit" && test -s "$policy" && test -s "$lab"
          grep -Fq 'downloads.all()' "$audit"
          grep -Fq 'context.getDatabasePath("vk-community-images.db")' "$audit"
          grep -Fq 'SQLiteDatabase.OPEN_READONLY' "$audit"
          grep -Fq 'privateSourceUri' "$audit"
          grep -Fq 'migrationCandidatesForManualQA' "$audit"
          grep -Fq 'massMigrationEnabled' "$audit"
          grep -Fq 'onExportMigrationInventory' "$lab"
          grep -Fq 'Старый перенос Download → Pictures ОТКЛЮЧЁН' "$lab"
          grep -Fq 'Массовая обработка отключена' "$lab"
          if grep -Eq 'resolver\.(insert|update|delete|openOutputStream)|contentResolver\.(insert|update|delete|openOutputStream)|\.writableDatabase|\.setLastModified\(|\.saveAttributes\(|dao\.(upsert|delete|moveSavedUriWhenCurrent)|\.edit\(\)' "$audit"; then
            echo '::error::Inventory code must never write to media, providers, or databases'
            exit 1
          fi
      - name: Read-only inventory and existing regression unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest -Parm64Release=true \
            --tests '*MigrationPreflightPolicyTest' \
            --tests '*InPlaceTrialPolicyTest' \
            --tests '*VideoChronologyTrialPolicyTest' \
            --tests '*ExifTrialPolicyTest' \
            --tests '*MediaStoreDateAuditPolicyTest' \
            --tests '*PhoneLibraryChronologyTest' \
            --tests '*MediaDateRepairPolicyTest' \
            --tests '*LegacyRelocationPolicyTest' \
            --tests '*GalleryLibraryStateTest' \
            --tests '*PhoneMediaLibraryTest' --stacktrace
      - name: Android lint
        run: ./gradlew :app:lintDebug -Parm64Release=true --stacktrace
      - name: ARM64 unsigned release
        run: ./gradlew :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Verify ARM64 and create local signing handoff
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -s "$apk"
          test "$(unzip -Z1 "$apk" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
          "$bt/aapt" dump badging "$apk" | grep -F "package: name='com.domenota.medialoader' versionCode='226' versionName='1.7.166'"
          mkdir -p handoff/tools/lib handoff/tools/lib64
          "$bt/zipalign" -p -f 4 "$apk" handoff/ML_1.7.166_ARM64_ALIGNED_UNSIGNED.apk
          "$bt/zipalign" -c -v 4 handoff/ML_1.7.166_ARM64_ALIGNED_UNSIGNED.apk
          cp "$bt/zipalign" handoff/tools/
          cp "$bt/lib/apksigner.jar" handoff/tools/lib/
          cp -a "$bt/lib64/." handoff/tools/lib64/
          git archive --format=zip -o handoff/ML_1.7.166_SOURCES_EXACT_COMMIT.zip HEAD
          git rev-parse HEAD > handoff/COMMIT_SHA.txt
          (cd handoff && sha256sum ML_1.7.166_ARM64_ALIGNED_UNSIGNED.apk ML_1.7.166_SOURCES_EXACT_COMMIT.zip tools/lib/apksigner.jar > VERIFIED_SHA256.txt)
      - name: Private one-day local signing handoff
        uses: actions/upload-artifact@v4
        with:
          name: ML_1.7.166_verified_unsigned_sources_local_signing
          path: handoff/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
