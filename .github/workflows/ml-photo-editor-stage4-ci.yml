name: ML photo editor stage 4 advanced color validation
on:
  push:
    branches:
      - feature/ml-photo-editor-stage4-color-20261031
  workflow_dispatch:
concurrency:
  group: ml-photo-editor-stage4-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android-check:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Full Android unit tests
        run: gradle :app:testDebugUnitTest -Parm64Release=true --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: ARM64 debug compile (no APK publication)
        run: gradle :app:assembleDebug -Parm64Release=true --stacktrace
