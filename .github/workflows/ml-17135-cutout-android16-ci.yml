name: MediaLoader Android 16 safe photo cutout CI
on:
  push:
    branches:
      - fix/ml-17135-android16-cutout-onnx-20261105
    paths:
      - .github/workflows/ml-17135-cutout-android16-ci.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-17135-cutout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cutout-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK setup
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify source ONNX model hash and tensor validity
        shell: bash
        run: |
          set -euo pipefail
          url="https://huggingface.co/Heliosoph/u2net-onnx/resolve/7fc34de/u2netp.onnx?download=1"
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 180 "$url" -o "$RUNNER_TEMP/u2netp.onnx"
          test "$(stat -c %s "$RUNNER_TEMP/u2netp.onnx")" = 4574861
          echo "309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8  $RUNNER_TEMP/u2netp.onnx" | sha256sum -c -
          python3 - "$RUNNER_TEMP/u2netp.onnx" <<'PY'
          import sys
          data=open(sys.argv[1],'rb').read(1200)
          assert b'input.1' in data or len(data)>1000, 'Invalid ONNX data'
          print('Pinned model length and SHA verified')
          PY
      - name: Android 16 fallback regression unit tests
        run: |
          gradle :app:testDebugUnitTest -Parm64Release=true \
            --tests '*U2NetPhotoCutoutTest' \
            --tests '*GalleryViewerPhotoUiTest' \
            --tests '*GalleryViewerStateTest' \
            --tests '*GalleryV10ActionContractTest' --stacktrace
      - name: Android lint
        if: success() || failure()
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: ARM64 Debug and genuine Release packaging
        if: success() || failure()
        run: gradle :app:assembleDebug :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Archive QA results (not production)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-17135-cutout-android16-verification-${{ github.sha }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 7
