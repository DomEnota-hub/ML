name: ML AI Stage 4 - real model QA ARM64 build and verified handoff (no publishing)

on:
  push:
    branches:
      - feature/ml-ai-eraser-stage4-reflection-model-gate-20261109
    paths:
      - .github/workflows/ml-ai-stage4-real-model-android-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-ai-stage4-audited-qa-build
  cancel-in-progress: true

jobs:
  real-model-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned real model conversion toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            'gdown==5.2.0' 'PyWavelets==1.7.0' 'numpy==1.26.4' \
            'Pillow==11.3.0' 'onnx==1.17.0' 'onnxruntime==1.20.1'
          python -m pip install --disable-pip-version-check --no-input \
            'torch==2.4.1+cpu' 'torchvision==0.19.1+cpu' \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Generate full pretrained DExNet plus VGG19 only after quality gates
        env:
          ML_DEXNET_SIDE: '128'
          ML_REFLECTION_MODEL_OUTPUT_DIR: app/src/main/assets/ai
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qa/stage4_dexnet_full_inference_smoke.py
          model=app/src/main/assets/ai/dexnet_vgg19_reflection_128.onnx
          test -s "$model"
          test -s "$model.sha256"
          (cd app/src/main/assets/ai && sha256sum -c dexnet_vgg19_reflection_128.onnx.sha256)
          git ls-files --error-unmatch "$model" >/dev/null 2>&1 && {
            echo 'Model weights MUST NOT be committed to Git' >&2; exit 1;
          } || :
          test "$(stat -c%s "$model")" -lt 110000000
      - name: Bootstrap pinned Gradle 8.9 from checked wrapper SHA
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4; do
            ./gradlew --version --no-daemon && break
            test "$i" != 4
            sleep 10
          done
      - name: Install Android SDK 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests with ACTUAL model bundled in BuildConfig
        run: |
          ./gradlew :app:testDebugUnitTest -PofficialQa=true \
            --tests '*ReflectionRemovalEngineTest' \
            --tests '*AiEraserAvailabilityTest' \
            --tests '*AiEraserModePolicyTest' \
            --tests '*SpecularGlareEngineTest' \
            --tests '*SpecularOverlayComposerTest' \
            --tests '*PersonSegmentationPipelineTest' --stacktrace
      - name: Android lint with real model configuration
        run: ./gradlew :app:lintDebug -PofficialQa=true --stacktrace
      - name: Load existing persistent QA-only signing identity (no private key in Git)
        env:
          MEDIA_DEBUG_KEYSTORE_B64: ${{ secrets.MEDIA_DEBUG_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MEDIA_DEBUG_KEYSTORE_B64:-}" ]; then
            echo "::error::Missing existing persistent MEDIA_DEBUG_KEYSTORE_B64 in GitHub Actions secrets."
            echo "::error::No APK or handoff created; never invent a signing identity."
            exit 1
          fi
          key="$RUNNER_TEMP/medialoader-qa-test-key.keystore"
          printf '%s' "$MEDIA_DEBUG_KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > "$key"
          chmod 600 "$key"
          keytool -list -keystore "$key" -storepass android -alias androiddebugkey >/dev/null
          echo "MEDIA_DEBUG_KEYSTORE_PATH=$key" >> "$GITHUB_ENV"
      - name: Assemble signed and isolated ARM64 review APK (NOT production)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug -PofficialQa=true -Parm64Release=true --stacktrace
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$bt/apksigner" verify --verbose "$apk"
          expected=$(keytool -exportcert -keystore "$MEDIA_DEBUG_KEYSTORE_PATH" -storepass android \
            -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          actual=$("$bt/apksigner" verify --print-certs "$apk" | \
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test -n "$actual" && test "$actual" = "$expected"
          "$bt/aapt" dump badging "$apk" | grep -F "name='com.domenota.medialoader.officialqa'"
          "$bt/aapt" dump badging "$apk" | grep -F "versionName='1.7.157-review'"
          test "$(unzip -Z1 "$apk" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = "arm64-v8a"
          unzip -Z1 "$apk" | grep -q '^assets/ai/dexnet_vgg19_reflection_128.onnx$'
          "$bt/zipalign" -c -v 4 "$apk"
          sha256sum "$apk"
      - name: Locally validate two QA ZIP parts and one exact-commit source ZIP
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qa/package_stage4_qa.py \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --out "$RUNNER_TEMP/ml-qa-handoff" \
            --version 1.7.157 --commit "$GITHUB_SHA"
          test "$(find "$RUNNER_TEMP/ml-qa-handoff" -maxdepth 1 -type f -name '*.zip' | wc -l)" = 3
          echo "::notice::Signed QA and 3 ZIPs validated on this ephemeral runner."
          echo "::notice::No GitHub artifacts/Releases or production files were published."
          echo "::warning::Google Drive delivery requires an authorized direct Drive upload connection; this job never publishes the local ZIPs."
      - name: Never persist model weights or APK in GitHub
        if: always()
        shell: bash
        run: |
          rm -f app/src/main/assets/ai/dexnet_vgg19_reflection_128.onnx
          rm -f app/src/main/assets/ai/dexnet_vgg19_reflection_128.onnx.sha256
          rm -rf "$RUNNER_TEMP/ml-qa-handoff"
          echo "Ephemeral model and QA packages wiped; no GitHub artifact published."
