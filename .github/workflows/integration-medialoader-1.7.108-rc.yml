name: MediaLoader 1.7.108 integration RC (ARM64 only)

on:
  push:
    branches: [integration/medialoader-1.7.108-rc]
  workflow_dispatch:

concurrency:
  group: medialoader-1.7.108-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify JavaScript/WebView integrations
        run: |
          set -euo pipefail
          node scripts/test-instagram-backdrop-recovery.cjs
          node scripts/test-youtube-thumbnail.cjs
          node scripts/test-hitmoz-native-script.cjs
          node scripts/test-muzmo-native-script.cjs

      - name: All Android unit tests
        run: gradle :app:testDebugUnitTest -Parm64Release=true --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace

      - name: Assemble one unsigned ARM64 release candidate (no debug APK)
        run: gradle :app:assembleRelease -Parm64Release=true --stacktrace

      - name: Verify version, package, architecture and unsigned state
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" |
            grep -F "package: name='com.domenota.medialoader' versionCode='170' versionName='1.7.108'"
          test "$(unzip -Z1 "$apk" | grep '^lib/' | cut -d/ -f2 | sort -u)" = "arm64-v8a"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify "$apk" && {
            echo "::error::Release candidate must remain unsigned until signed by existing DomEnota key"
            exit 1
          } || true
          mkdir -p rc-output
          cp "$apk" rc-output/MediaLoader_1.7.108_arm64_RC_UNSIGNED.apk
          sha256sum rc-output/MediaLoader_1.7.108_arm64_RC_UNSIGNED.apk > rc-output/sha256.txt

      - name: Upload unsigned candidate for existing-key signing (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-1.7.108-arm64-RC-signing-handoff
          path: rc-output/
          if-no-files-found: error
          retention-days: 1
