name: ML photo editor stage 5 integrated ARM64 QA
on:
  push:
    branches: [integration/ml-photo-5-stages-arm64-20261101]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-photo-stage5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Full integrated Android unit and regression suite
        run: gradle :app:testDebugUnitTest -Parm64Release=true --stacktrace
      - name: Android Lint
        if: success() || failure()
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: ARM64 isolated debug QA APK
        if: success()
        run: gradle :app:assembleDebug -Parm64Release=true -PhitmozArm64=true --stacktrace
      - name: Verify QA APK package, signature, ABI and digest
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.domenota.medialoader.hitmoz'"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          unzip -Z1 "$APK" > /tmp/ml-photo-stage5-apk-entries.txt
          grep -E '^lib/arm64-v8a/.*\.so
            echo "Unexpected non-arm64 native libraries in QA package" >&2
            exit 1
          fi
          sha256sum "$APK"
          du -h "$APK"
      - name: Upload one short-lived ARM64 QA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ML-1.7.110-photo-stage5-ARM64-QA-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
 /tmp/ml-photo-stage5-apk-entries.txt > /dev/null
          if grep -E '^lib/(armeabi-v7a|x86|x86_64)/' /tmp/ml-photo-stage5-apk-entries.txt; then
            echo "Unexpected non-arm64 native libraries in QA package" >&2
            exit 1
          fi
          sha256sum "$APK"
          du -h "$APK"
      - name: Upload one short-lived ARM64 QA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ML-1.7.110-photo-stage5-ARM64-QA-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
