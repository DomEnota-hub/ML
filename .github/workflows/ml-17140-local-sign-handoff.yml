name: MediaLoader 1.7.140 local signing handoff
on:
  push:
    branches:
      - feature/ml-17140-gallery-bulk-album-move-20261106
    paths:
      - .github/workflows/ml-17140-local-sign-handoff.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android build tools
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build real ARM64 Release for offline DomEnota signing
        run: gradle :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Align and validate unsigned package
        shell: bash
        run: |
          set -euo pipefail
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          source="app/build/outputs/apk/release/app-release-unsigned.apk"
          mkdir -p handoff signing-tools
          output="handoff/ML_1.7.140_ARM64_ALIGNED_UNSIGNED.apk"
          test -s "$source"
          "$bt/aapt" dump badging "$source" | grep -F "package: name='com.domenota.medialoader' versionCode='201' versionName='1.7.140'"
          test "$(unzip -Z1 "$source" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = "arm64-v8a"
          "$bt/zipalign" -p -f 4 "$source" "$output"
          "$bt/zipalign" -c -v 4 "$output"
          cp "$bt/lib/apksigner.jar" signing-tools/
          sha256sum "$output" > handoff/ALIGNED_UNSIGNED_SHA256.txt
      - name: Preserve aligned unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: ml-17140-aligned-unsigned-for-offline-signing
          path: handoff/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Preserve official Android APK signing tool
        uses: actions/upload-artifact@v4
        with:
          name: ml-17140-apksigner-tool
          path: signing-tools/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
