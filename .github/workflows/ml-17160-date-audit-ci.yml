name: ML date audit QA - read-only regression
on:
  push:
    branches:
      - fix/ml-17160-mediastore-date-audit-20261110
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml17160-date-audit
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle and SDK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version --no-daemon
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Date audit, recovery and safe migration tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest -Parm64Release=true \
            --tests '*MediaStoreDateAuditPolicyTest' \
            --tests '*PhoneLibraryChronologyTest' \
            --tests '*MediaDateRepairPolicyTest' \
            --tests '*LegacyRelocationPolicyTest' \
            --tests '*MediaStoragePolicyTest' --stacktrace
      - name: Android lint
        run: ./gradlew :app:lintDebug -Parm64Release=true --stacktrace
      - name: Compile without publishing release
        run: ./gradlew :app:compileReleaseKotlin -Parm64Release=true --stacktrace
      - name: Enforce read-only audit
        shell: bash
        run: |
          set -euo pipefail
          file=app/src/main/java/com/domenota/medialoader/data/storage/GalleryMediaDateAudit.kt
          if grep -Eq 'resolver\.(insert|update|delete)|contentResolver\.(insert|update|delete)|setLastModified|openOutputStream' "$file"; then
            echo "::error::Date audit must be read-only"
            exit 1
          fi
