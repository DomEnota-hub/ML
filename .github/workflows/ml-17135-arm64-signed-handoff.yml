name: MediaLoader 1.7.135 Android16 cutout ARM64 Release handoff
on:
  push:
    branches:
      - build/ml-17135-arm64-cutout-qa-20261105
    paths:
      - .github/workflows/ml-17135-arm64-signed-handoff.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-17135-arm64-unsigned-handoff
  cancel-in-progress: true
jobs:
  release-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android 35 build tools
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: ARM64 genuine Release build for signed device QA
        run: gradle :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Validate release package, version, ABI and hash
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" |
            grep -F "package: name='com.domenota.medialoader' versionCode='196' versionName='1.7.135'"
          test "$(unzip -Z1 "$apk" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
          mkdir -p output
          cp "$apk" output/ML_1.7.135_ARM64_UNSIGNED.apk
          sha256sum output/ML_1.7.135_ARM64_UNSIGNED.apk | tee output/SHA256.txt
      - name: Deliver unsigned Release for local DomEnota signing
        uses: actions/upload-artifact@v4
        with:
          name: ml-17135-arm64-release-unsigned-local-sign
          path: output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
