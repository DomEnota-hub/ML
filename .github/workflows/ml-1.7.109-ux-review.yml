name: ML 1.7.109 UX review ARM64 CI
on:
  push:
    branches:
      - fix/ml-ux-review-20261031
  workflow_dispatch:

concurrency:
  group: ml-17109-ux-review
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify source injection scripts
        run: |
          set -euo pipefail
          node scripts/test-instagram-backdrop-recovery.cjs
          node scripts/test-youtube-thumbnail.cjs
          node scripts/test-hitmoz-native-script.cjs
          node scripts/test-muzmo-native-script.cjs

      - name: Full Android unit tests
        run: gradle :app:testDebugUnitTest -Parm64Release=true --stacktrace

      - name: Android Lint
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace

      - name: Assemble Android debug and unsigned ARM64 release
        run: gradle :app:assembleDebug :app:assembleRelease -Parm64Release=true --stacktrace

      - name: Verify ML label, package, version, ARM64 architecture and unsigned state
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" |
            grep -F "package: name='com.domenota.medialoader' versionCode='171' versionName='1.7.109'"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" |
            grep -F "application-label:'ML'"
          test "$(unzip -Z1 "$apk" | grep '^lib/' | cut -d/ -f2 | sort -u)" = "arm64-v8a"
          if "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify "$apk"; then
            echo "::error::Candidate must remain unsigned until signed with the existing DomEnota key"
            exit 1
          fi
          mkdir -p release-output
          cp "$apk" release-output/ML_1.7.109_arm64_UNSIGNED.apk
          sha256sum release-output/ML_1.7.109_arm64_UNSIGNED.apk > release-output/SHA256.txt

      - name: Upload unsigned candidate and hash
        uses: actions/upload-artifact@v4
        with:
          name: ML-1.7.109-arm64-signing-handoff
          path: release-output/
          if-no-files-found: error
          retention-days: 3
