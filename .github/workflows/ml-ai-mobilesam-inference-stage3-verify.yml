  push:
    branches:
      - feature/ml-ai-eraser-mobilesam-inference-stage3-20261108
      - feature/ml-ai-eraser-qa156-stage1-ui-copy-20261109
      - feature/ml-ai-eraser-qa156-stage1-controls-20261109
      - feature/ml-ai-eraser-qa156-stage1-auto-drag-20261109
      - feature/ml-ai-eraser-qa156-stage1-manual-object-trace-20261109
      - feature/ml-ai-eraser-qa156-stage1-model-update-check-20261109
      - feature/ml-ai-eraser-qa156-stage1-honest-modes-20261109
      - feature/ml-ai-eraser-qa156-stage1-magnifier-geometry-20261109
      - feature/ml-ai-eraser-qa156-stage1-gapi-balance-20261109
      - feature/ml-ai-eraser-stage2-people-detector-20261109
      - feature/ml-ai-eraser-stage3-specular-srnet-poc-20261109
      - feature/ml-ai-eraser-stage4-reflection-model-gate-20261109
  pull_request:
    branches:
      - feature/ml-ai-eraser-mobilesam-inference-stage3-20261108
      - feature/ml-ai-eraser-qa156-stage1-ui-copy-20261109
      - feature/ml-ai-eraser-qa156-stage1-controls-20261109
      - feature/ml-ai-eraser-qa156-stage1-auto-drag-20261109
      - feature/ml-ai-eraser-qa156-stage1-manual-object-trace-20261109
      - feature/ml-ai-eraser-qa156-stage1-model-update-check-20261109
      - feature/ml-ai-eraser-qa156-stage1-honest-modes-20261109
      - feature/ml-ai-eraser-qa156-stage1-magnifier-geometry-20261109
      - feature/ml-ai-eraser-qa156-stage1-gapi-balance-20261109
      - feature/ml-ai-eraser-stage2-people-detector-20261109
      - feature/ml-ai-eraser-stage3-specular-srnet-poc-20261109
      - feature/ml-ai-eraser-stage4-reflection-model-gate-20261109
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-ai-mobilesam-stage3
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bootstrap Gradle 8.9 from direct distribution mirror
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Avoid Gradle provisioning API (currently returning intermittent 504).
          # Third-party Gradle binary mirror serves the exact 8.9 archive
          # without the blocked GitHub releases redirect. The wrapper verifies
          # distributionSha256Sum from the checked-in properties.
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for attempt in 1 2 3 4; do
            if ./gradlew --version --no-daemon; then
              break
            fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep 10
          done
      - name: Verify official Maven repos without unstable Aliyun proxy
        shell: bash
        run: |
          set -euo pipefail
          # Aliyun public mirror returned HTTP 502 and Gradle disabled the
          # repository for all dependencies. Use original tracked settings.
          grep -q 'google()' settings.gradle
          grep -q 'mavenCentral()' settings.gradle
      - name: Install Android SDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
