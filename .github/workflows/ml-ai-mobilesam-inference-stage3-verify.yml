      - name: Install headless MediaPipe EGL/GLES shared libraries
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libgles2 libegl1 libgl1
      - name: Real EfficientDet-Lite0 model weights and 0/1/2 people smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input \
            "mediapipe==0.10.35" "Pillow>=10,<13"
          python3 scripts/qa/stage2_real_detector_smoke.py
      - name: Real MobileSAM and LaMa ONNX weight-backed inference
        shell: bash
