name: ML 1.7.204 recovery stages targeted checks
on:
  push:
    branches:
      - feature/ml-17204-recovery-compatibility
    paths:
      - '.github/workflows/ml-17204-recovery-targeted.yml'
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/build.gradle'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-17204-recovery-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android and Gradle setup
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4; do
            ./gradlew --version --no-daemon && break
            test "$i" != 4
            sleep 10
          done
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Exact QA identity
        run: |
          grep -Eq 'versionCode 264$' app/build.gradle
          grep -Fq "versionName '1.7.204'" app/build.gradle
      - name: Stage 1 metadata and existing 1.7.203 move checkpoints
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests com.domenota.medialoader.data.catalog.visibility.VisibilityRestoreMetadataPolicyTest \
            --tests com.domenota.medialoader.data.catalog.visibility.FolderVisibilityMoveTest \
            --tests com.domenota.medialoader.data.catalog.visibility.VisibilityMediaStoreAdapterTest \
            --tests com.domenota.medialoader.data.catalog.visibility.VisibilityPrivatePublicationGateTest \
            --tests com.domenota.medialoader.data.privatevault.PrivateMediaOperationsTest \
            --stacktrace --no-daemon --console=plain
      - name: Save targeted test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ML_17204_recovery_targeted
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 2
          if-no-files-found: ignore
