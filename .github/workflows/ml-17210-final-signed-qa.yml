name: ML 1.7.210 stage5 final signed ARM64 QA (no releases)
on:
  push:
    branches:
      - feature/ml-stage5-qa-selective-archive
    paths:
      - .github/workflows/ml-17210-final-signed-qa.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-17210-private-signed-qa
  cancel-in-progress: true
jobs:
  signed-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle wrapper bootstrap
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4; do
            ./gradlew --version --no-daemon && break
            test "$i" != 4
            sleep 10
          done
      - name: Android build tools
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Optional built-in GAPI keys from protected input, never logged
        shell: bash
        env:
          GAPI_B64: ${{ secrets.ML_GAPI_BUILTIN_KEYS_JSON_B64 }}
        run: |
          set -euo pipefail
          if test -n "${GAPI_B64:-}"; then
            mkdir -p .gapi-local
            printf '%s' "$GAPI_B64" | base64 --decode > .gapi-local/builtin-keys.json
            chmod 600 .gapi-local/builtin-keys.json
            python3 -c 'import json; a=json.load(open(".gapi-local/builtin-keys.json")); assert isinstance(a,list) and len(a)>=2 and all(isinstance(x,dict) and str(x.get("id","")).strip() and str(x.get("key","")).strip() for x in a); assert len({x["id"] for x in a})==len(a) and len({x["key"] for x in a})==len(a)'
            echo "Protected GAPI pack verified."
          else
            echo "::error::Protected built-in GAPI asset is missing: refuse incomplete signed QA"; exit 1
          fi
      - name: Verify exact ML 1.7.210 QA identity
        run: |
          set -euo pipefail
          grep -Eq 'versionCode 270$' app/build.gradle
          grep -Fq "versionName '1.7.210'" app/build.gradle
          test "$GITHUB_REF_NAME" = feature/ml-17205-hidden-v2
      - name: Exact safety and observed Muzmo redirect regressions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest -Parm64Release=true \
            --tests com.domenota.medialoader.data.download.MuzmoDownloadUrlsTest \
            --tests com.domenota.medialoader.data.catalog.visibility.VisibilityV2JournalStoreTest \
            --tests com.domenota.medialoader.data.catalog.visibility.VisibilityV2CrashReplayTest \
            --tests com.domenota.medialoader.data.catalog.visibility.VisibilityLegacyUpgradeTest \
            --tests com.domenota.medialoader.data.catalog.visibility.VisibilityPrivatePublicationGateTest \
            --tests com.domenota.medialoader.data.catalog.visibility.VisibilityPreflightV2Test \
            --stacktrace --no-daemon --console=plain
      - name: Full isolated JVM and Compose suite (no omitted methods)
        run: python3 scripts/run-jvm-isolated-compose.py full
      - name: Lint and ARM64 Release build
        run: ./gradlew :app:lintDebug :app:assembleRelease -Parm64Release=true --stacktrace --no-daemon
      - name: DomEnota signature, exact sources and bounded APK split
        shell: bash
        env:
          ML_RELEASE_KEYSTORE_BASE64: ${{ secrets.ML_RELEASE_KEYSTORE_BASE64 }}
          ML_RELEASE_STORE_PASSWORD: ${{ secrets.ML_RELEASE_STORE_PASSWORD }}
          ML_RELEASE_KEY_ALIAS: ${{ secrets.ML_RELEASE_KEY_ALIAS }}
          ML_RELEASE_KEY_PASSWORD: ${{ secrets.ML_RELEASE_KEY_PASSWORD }}
          ML_RELEASE_SIGNER_SHA256: ${{ secrets.ML_RELEASE_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          for var in ML_RELEASE_KEYSTORE_BASE64 ML_RELEASE_STORE_PASSWORD ML_RELEASE_KEY_ALIAS ML_RELEASE_KEY_PASSWORD ML_RELEASE_SIGNER_SHA256; do
            if test -z "${!var:-}"; then echo "::error::Missing protected signing input: $var"; exit 1; fi
          done
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$unsigned"
          "$bt/aapt" dump badging "$unsigned" | grep -F "package: name='com.domenota.medialoader' versionCode='270' versionName='1.7.210'"
          test "$(unzip -Z1 "$unsigned" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
          mkdir -p "$RUNNER_TEMP/mlsecure" bundle handoff/part01 handoff/source
          key="$RUNNER_TEMP/mlsecure/key.jks"
          aligned="$RUNNER_TEMP/mlsecure/aligned.apk"
          signed="$RUNNER_TEMP/mlsecure/ML_1.7.210_ARM64_DomEnota_SIGNED.apk"
          trap 'rm -f "$key" "$aligned"' EXIT
          printf '%s' "$ML_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          "$bt/zipalign" -P 16 -f 4 "$unsigned" "$aligned"
          "$bt/apksigner" sign --min-sdk-version 26 --ks "$key" \
            --ks-key-alias "$ML_RELEASE_KEY_ALIAS" \
            --ks-pass env:ML_RELEASE_STORE_PASSWORD \
            --key-pass env:ML_RELEASE_KEY_PASSWORD \
            --out "$signed" "$aligned"
          "$bt/apksigner" verify --verbose "$signed"
          "$bt/zipalign" -c -P 16 4 "$signed"
          actual="$("$bt/apksigner" verify --print-certs "$signed" | sed -nE 's/^Signer #1 certificate SHA-256 digest: ([0-9a-fA-F:]+).*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          expected="$(printf '%s' "$ML_RELEASE_SIGNER_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ': ')"
          reference=4f6f0ddf4d8fd2669fd2a3a6ebab6e84bda17281a3a5badada0e1eeb73a4f1d2
          test -n "$actual" && test "$actual" = "$expected" && test "$actual" = "$reference" || { echo "::error::Wrong upgrade signing certificate"; exit 1; }
          "$bt/aapt" dump badging "$signed" | grep -F "package: name='com.domenota.medialoader' versionCode='270' versionName='1.7.210'"
          test "$(unzip -Z1 "$signed" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
          sha256sum "$signed" | sed "s#$signed#ML_1.7.210_ARM64_DomEnota_SIGNED.apk#" > bundle/APK_SHA256.txt
          zip -q -0 -j -s 80m bundle/ML_1.7.210_ARM64_DomEnota_SIGNED.zip "$signed"
          zip -s 0 bundle/ML_1.7.210_ARM64_DomEnota_SIGNED.zip --out "$RUNNER_TEMP/mlsecure/reassembled.zip" >/dev/null
          expected_apk="$(sha256sum "$signed" | awk '{print $1}')"
          actual_apk="$(unzip -p "$RUNNER_TEMP/mlsecure/reassembled.zip" ML_1.7.210_ARM64_DomEnota_SIGNED.apk | sha256sum | awk '{print $1}')"
          test "$expected_apk" = "$actual_apk"
          git archive --format=zip -o handoff/source/ML_1.7.210_SOURCES_EXACT_COMMIT.zip HEAD
          git rev-parse HEAD > handoff/source/COMMIT_SHA.txt
          (cd handoff/source && sha256sum ML_1.7.210_SOURCES_EXACT_COMMIT.zip > SOURCE_SHA256.txt)
          cat > bundle/README_RU.txt <<'EOF'
          MediaLoader 1.7.210 QA / 270. Android ARM64, сертификат DomEnota. НЕ STABLE.
          ВАЖНО: один итоговый тестовый выпуск поверх установленной 1.7.209/269.
          Список отличий от 1.7.209 (по объединённому циклу из пяти этапов):
          ГАЛЕРЕЯ: единая точка поиска дубликатов через лупу; более компактные
          начало/остановка/результаты; безопасный движок Архива и предварительная
          проверка состава каталога. Выборочное скрытие 1–12 файлов работает
          ТОЛЬКО как явно включённая тестовая QA с двухэтапным подтверждением.
          При смешанном каталоге не создавать .nomedia для всех соседних файлов.
          МУЗЫКА: компактный поэтапный прогресс поиска дубликатов, множественный
          выбор долгим нажатием на миниатюру с действием Коллекция,
          сравнение двух реально декодированных аудиоволн, исправленная подпись
          Shazam без лишнего разделителя после имени; сворачиваемый прогресс
          подтверждённого переноса дубликатов в системную корзину.
          ВИДЕО: перераспределены кнопки управления просмотрщиком; устранена
          конкуренция жестов перемотки и ускорения ×2.
          ФОТОРЕДАКТОР: пакетное Сохранить сверху и стабильный предпросмотр,
          без изменения оригиналов до подтверждённого экспорта.
          ИСТОЧНИКИ: Instagram Reel не выдаёт картинку-обложку вместо самого
          видео, если доступен только постер; в браузере YouTube поддержаны
          короткие ссылки youtu.be со строгой проверкой домена.
          ТЕХНИЧЕСКОЕ: журнал Архива и fail-closed защита неизвестных
          MediaStore/URI/ID, повторные проверки файлов перед мутациями.
          ОГРАНИЧЕНИЯ: не подтверждено реальным Xiaomi Android 16,
          распознавание Shazam live требует отдельного opt-in, сетевые сайты
          могут изменять ответы и авторизацию. QA не является stable release.

          APK и исходники только с точного коммита данного CI; без GitHub Releases.
          Каждый APK_PART*.zip является архивом передачи: распакуйте каждый из них.
          Все внутренние тома .z01, .z02 и т. д. и последний .zip положите в одну папку.
          Откройте ПОСЛЕДНИЙ ML_1.7.210_ARM64_DomEnota_SIGNED.zip в ZArchiver/7-Zip,
          извлеките APK и обновите приложение БЕЗ удаления предыдущей версии.
          Сверьте SHA-256 APK из APK_SHA256.txt. Исходники в SOURCES.zip.
          ВЫБОРОЧНЫЙ АРХИВ: только шесть РАСХОДНЫХ копий в каталоге с другими
          файлами (пример 6 из 806), оригиналы отдельно; сверить read-only
          preflight, отказ по отмене, перенос, повторное появление после возврата,
          сохранение соседних файлов и связей. НЕ тестировать на оригиналах.
          Проверить сворачивание/раскрытие корзины, результаты ошибок, обычное
          аудио, видео, Instagram и YouTube; долгий жест и две волны.
          При сомнении в статусе Архива НЕ повторять мутирующее действие
          до изучения журнала; аппаратная приёмка нужна отдельно.
          EOF
          mapfile -t pieces < <(find bundle -maxdepth 1 -type f \( -name '*.z[0-9][0-9]' -o -name '*.zip' \) | sort)
          count="${#pieces[@]}"
          if (( count < 2 || count > 5 )); then echo "::error::APK archive must contain 2 to 5 verified volumes, got $count parts"; exit 1; fi
          i=0
          for piece in "${pieces[@]}"; do
            i=$((i+1))
            dir="handoff/part0$i"
            mkdir -p "$dir"
            cp "$piece" "$dir/"
            cp bundle/APK_SHA256.txt bundle/README_RU.txt "$dir/"
            test "$(stat -c%s "$piece")" -lt 95000000
          done
          echo "Verified private signed QA; $count archive parts; exact source $(git rev-parse --short HEAD)"
      - name: Short-lived private APK part 1 handoff
        uses: actions/upload-artifact@v4
        with:
          name: ML_1.7.210_APK_PART01
          path: handoff/part01/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Short-lived private APK part 2 handoff
        if: ${{ hashFiles('handoff/part02/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ML_1.7.210_APK_PART02
          path: handoff/part02/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Short-lived private APK part 3 handoff
        if: ${{ hashFiles('handoff/part03/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ML_1.7.210_APK_PART03
          path: handoff/part03/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Short-lived private APK part 4 handoff
        if: ${{ hashFiles('handoff/part04/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ML_1.7.210_APK_PART04
          path: handoff/part04/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Short-lived private APK part 5 handoff
        if: ${{ hashFiles('handoff/part05/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ML_1.7.210_APK_PART05
          path: handoff/part05/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Short-lived private exact source handoff
        uses: actions/upload-artifact@v4
        with:
          name: ML_1.7.210_SOURCES
          path: handoff/source/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
