name: ML 1.7.159 chronology recovery - tests, lint, ARM64
on:
  push:
    branches:
      - fix/ml-17159-safe-gallery-chronology-20261110
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-17159-gallery-chronology-ci
  cancel-in-progress: true
jobs:
  verify-date-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4; do
            ./gradlew --version --no-daemon && break
            test "$i" != 4
            sleep 10
          done
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Chronology, migration, room and gallery regressions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest -Parm64Release=true \
            --tests '*PhoneLibraryChronologyTest' \
            --tests '*LegacyRelocationPolicyTest' \
            --tests '*LegacyMediaMigrationHistoryTest' \
            --tests '*MediaStoragePolicyTest' \
            --tests '*GalleryLibraryStateTest' \
            --tests '*GalleryAlbumFileSortTest' \
            --tests '*GalleryDateNavigationTest' \
            --tests '*PhoneMediaLibraryTest' \
            --stacktrace
      - name: Android lint
        run: ./gradlew :app:lintDebug -Parm64Release=true --stacktrace
      - name: Compile ARM64 unsigned
        run: ./gradlew :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Check ARM64 output and source safety
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          archs="$(unzip -Z1 "$apk" | awk -F/ '$1=="lib" {print $2}' | sort -u)"
          test "$archs" = arm64-v8a
          # Verify this branch never uses the destructive legacy copier.
          if sed -n '/suspend fun migrate(/,/private fun belongsToLegacyDownloads/p' \
            app/src/main/java/com/domenota/medialoader/data/storage/LegacyMediaMigration.kt |
            grep -Eq 'publishVerifiedLegacyCopy|deleteDownloadPermanently|moveSavedUriWhenCurrent'; then
            echo "::error::Destructive legacy copy, delete or URI swap returned!"
            exit 1
          fi
          echo "In-place only, no destructive migration code in entrypoint."
