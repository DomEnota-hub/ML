name: ML 1.7.159 safe chronology restore QA
on:
  push:
    branches:
      - fix/ml-17159-safe-gallery-chronology-20261110
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml17159-safe-chronology-ci
  cancel-in-progress: true
jobs:
  verify-date-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4; do
            ./gradlew --version --no-daemon && break
            test "$i" != 4
            sleep 10
          done
      - name: Install SDK35
        shell: bash
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify exact version
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'versionCode 219$' app/build.gradle
          grep -Fq "versionName '1.7.159'" app/build.gradle
          test "$GITHUB_REF_NAME" = "fix/ml-17159-safe-gallery-chronology-20261110"
      - name: Run chronology and migration regression tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest -Parm64Release=true \
            --tests '*PhoneLibraryChronologyTest' \
            --tests '*LegacyRelocationPolicyTest' \
            --tests '*MediaDateRepairPolicyTest' \
            --tests '*LegacyMediaMigrationHistoryTest' \
            --tests '*MediaStoragePolicyTest' \
            --tests '*GalleryLibraryStateTest' \
            --tests '*GalleryAlbumFileSortTest' \
            --tests '*GalleryDateNavigationTest' \
            --tests '*PhoneMediaLibraryTest' \
            --stacktrace
      - name: Android lint
        run: ./gradlew :app:lintDebug -Parm64Release=true --stacktrace
      - name: Build ARM64 unsigned release
        run: ./gradlew :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Verify no destructive copy/delete migration
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          test "$(unzip -Z1 "$apk" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
          if sed -n '/suspend fun migrate(/,/private fun belongsToLegacyDownloads/p' app/src/main/java/com/domenota/medialoader/data/storage/LegacyMediaMigration.kt | grep -Eq 'publishVerifiedLegacyCopy|deleteDownloadPermanently|moveSavedUriWhenCurrent'; then
            echo "::error::Unsafe copy/delete migration found"
            exit 1
          fi
      - name: Prepare local DomEnota signing handoff
        shell: bash
        run: |
          set -euo pipefail
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          "$bt/aapt" dump badging "$apk" | grep -F "package: name='com.domenota.medialoader' versionCode='219' versionName='1.7.159'"
          mkdir -p handoff/tools/lib handoff/tools/lib64
          "$bt/zipalign" -p -f 4 "$apk" handoff/ML_1.7.159_ARM64_ALIGNED_UNSIGNED.apk
          "$bt/zipalign" -c -v 4 handoff/ML_1.7.159_ARM64_ALIGNED_UNSIGNED.apk
          cp "$bt/zipalign" handoff/tools/
          cp "$bt/lib/apksigner.jar" handoff/tools/lib/
          cp -a "$bt/lib64/." handoff/tools/lib64/
          git archive --format=zip -o handoff/ML_1.7.159_SOURCES_EXACT_COMMIT.zip HEAD
          git rev-parse HEAD > handoff/COMMIT_SHA.txt
          (cd handoff && sha256sum ML_1.7.159_ARM64_ALIGNED_UNSIGNED.apk ML_1.7.159_SOURCES_EXACT_COMMIT.zip tools/lib/apksigner.jar > VERIFIED_SHA256.txt)
      - name: Private one-day signing handoff only
        uses: actions/upload-artifact@v4
        with:
          name: ML_1.7.159_local-signing-handoff
          path: handoff/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
