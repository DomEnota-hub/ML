name: Publish MediaLoader Photo QA APK as GitHub prerelease
on:
  push:
    branches:
      - integration/ml-photo-5-stages-arm64-20261101
    paths:
      - .github/workflows/ml-photo-qa-github-release.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ml-photo-qa-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: "41329461287"
      SOURCE_NAME: "ML-1.7.110-Round2-Refined-ARM64-QA"
      SOURCE_SHA: "f144adb64100bc250e1a45e5deca28b4a059193a"
      EXPECTED_SHA256: "2306a04f5fccc53eb7f3372c47c59eae754e0fad39a9a18916acba04530b3959"
      RELEASE_TAG: "qa-round2-1.7.111-cycle2-refined-20261101"
      RELEASE_ASSET: "MediaLoader-1.7.111-Cycle2-Refined-ARM64-QA.apk"
    steps:
      - name: Download verified QA APK from successful integration workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/photo-qa"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_NAME" --dir "$RUNNER_TEMP/photo-qa"
          test -s "$RUNNER_TEMP/photo-qa/app-debug.apk"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/photo-qa/app-debug.apk" | sha256sum --check --status
          echo "QA artifact SHA-256 verified"
      - name: Publish downloadable GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          mv "$RUNNER_TEMP/photo-qa/app-debug.apk" "$RUNNER_TEMP/photo-qa/$RELEASE_ASSET"
          asset="$RUNNER_TEMP/photo-qa/$RELEASE_ASSET"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          **MediaLoader 1.7.111 — уточнённая QA второго цикла замечаний.**

          - RGB-кривые: большие точки, создание узла касанием, предпросмотр 720px и ускоренный LUT-путь без повторного вычисления HSL/гаммы при изменении только кривых.
          - Рисование: ластик стирает штрихи по мере движения, не выполняет второй проход при отпускании; размеры кистей независимы.
          - Геометрия: исправлены перепутанные направления перспективы, диапазон расширен до ±100 с длинной точной шкалой.
          - Текст: компактные жёлтые ползунки вместо фиолетовых вертикальных маркеров, более низкая панель «Стиль», быстрые кнопки дублирования и удаления.
          - Галерея: полупрозрачный плавающий переключатель; последний ряд доступен благодаря нижнему отступу прокрутки.
          - Настройки: распределены цвета значков, молния режима загрузки Instagram заменена стрелками переключения.
          - Глобальная переделка фиолетового цвета отложена, это отдельная будущая задача.
          - Потребуется ручная проверка скорости и жестов на реальном устройстве.
          - Android unit-тесты, Lint, ARM64 сборка, подпись debug и проверка ABI: SUCCESS.
          
          **Это тестовый APK, не подписанный релиз DomEnota.** Пакет com.domenota.medialoader.hitmoz устанавливается отдельно.
          
          Источник проверки: https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN
          SHA-256: $EXPECTED_SHA256
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" --title "MediaLoader 1.7.111 · Cycle 2 Refined QA · ARM64" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq ".assets[] | select(.name == \"$RELEASE_ASSET\") | .name" \
            | grep -Fx "$RELEASE_ASSET"
      - name: Verify downloaded GitHub Release asset before deleting older QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/download-verify"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$RELEASE_ASSET" --dir "$RUNNER_TEMP/download-verify"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/download-verify/$RELEASE_ASSET" |
            sha256sum --check --status
          echo "Published QA asset SHA-256 verified; old QA releases may be rotated"
      - name: Remove duplicate APK asset from earlier failed publication
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -Fx "app-debug.apk"; then
            gh release delete-asset "$RELEASE_TAG" "app-debug.apk" \
              --repo "$GITHUB_REPOSITORY" --yes
          fi
      - name: Remove only older QA prereleases after verified new upload
        shell: bash
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and ((.tagName | startswith("qa-photo-")) or (.tagName | startswith("qa-round2-")))) | .tagName' \
            > "$RUNNER_TEMP/old-qa-tags.txt"
          while IFS= read -r old; do
            if [[ -n "$old" && "$old" != "$RELEASE_TAG" ]]; then
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
          done < "$RUNNER_TEMP/old-qa-tags.txt"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
