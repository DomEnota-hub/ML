name: MediaLoader 1.7.136 Gallery QA v4
on:
  push:
    branches:
      - fix/ml-17136-gallery-qa-v4-20261106
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-17136-gallery-qa
  cancel-in-progress: true
jobs:
  verify-gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android 35 SDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test wallpaper, OCR, submenu and viewer regression
        run: |
          gradle :app:testDebugUnitTest -Parm64Release=true \
            --tests '*GalleryWallpaperExportTest' \
            --tests '*LocalTextOcrFallbackTest' \
            --tests '*GalleryV10SubmenuPlacementTest' \
            --tests '*GalleryV10ActionContractTest' \
            --tests '*GalleryViewerPhotoUiTest' \
            --tests '*GalleryViewerStateTest' \
            --tests '*U2NetPhotoCutoutTest' --stacktrace
      - name: Android lint
        if: success() || failure()
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: Assemble ARM64 Debug and Release
        if: success()
        run: gradle :app:assembleDebug :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Save QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-17136-gallery-qa-results-${{ github.sha }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/outputs/apk/debug/
            app/build/outputs/apk/release/
          retention-days: 7
          if-no-files-found: warn
