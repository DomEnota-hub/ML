name: ML AI Stage 3 - genuine pretrained SRNet specular removal

on:
  push:
    branches:
      - feature/ml-ai-eraser-stage3-specular-srnet-poc-20261109
    paths:
      - scripts/qa/stage3_real_srnet_export_smoke.py
      - .github/workflows/ml-ai-stage3-specular-real-weights-poc.yml
  pull_request:
    branches:
      - feature/ml-ai-eraser-stage2-people-detector-20261109
    paths:
      - scripts/qa/stage3_real_srnet_export_smoke.py
      - .github/workflows/ml-ai-stage3-specular-real-weights-poc.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-stage3-specular-srnet-poc
  cancel-in-progress: true

jobs:
  real-model:
    name: MIT pretrained SRNet PyTorch-to-ONNX CPU quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only audited model export dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            "numpy==1.26.4" "onnx==1.17.0" "onnxruntime==1.20.1"
          python -m pip install --disable-pip-version-check --no-input \
            "torch==2.4.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Actual MIT pretrained weights with ONNX parity and highlight restoration quality
        env:
          ML_EXPORT_ONNX_BLOB: '1'
        shell: bash
        run: |
          set -euo pipefail
          OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 \
            python scripts/qa/stage3_real_srnet_export_smoke.py
      - name: State true scope of successful proof
        if: success()
        run: |
          echo 'Verified: real pretrained MIT-licensed SRNet code and weights, reproducible ONNX export.'
          echo 'Verified: source-vs-ONNX parity and synthetic diffuse-target quality on Linux CPU.'
          echo 'Not verified: Android ARM64 inference, broader photos, real glare generalization.'
          echo 'No APK, model, weight, or archive is published in GitHub.'
