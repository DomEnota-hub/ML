name: ML 1.7.157 private unsigned and ONNX handoff for local DomEnota signing
on:
  push:
    branches:
      - feature/ml-ai-eraser-stage4-reflection-model-gate-20261109
    paths:
      - .github/workflows/ml-17157-private-unsigned-local-sign-handoff.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-17157-one-off-private-handoff
  cancel-in-progress: false
jobs:
  android-unsigned:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bootstrap verified Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4; do
            ./gradlew --version --no-daemon && break
            test "$i" != 4
            sleep 10
          done
      - name: Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug -Parm64Release=true --stacktrace
      - name: Build unsigned exact-commit ARM64 Release
        run: ./gradlew :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Verify and privately stage unsigned APK, official tools, source ZIP
        shell: bash
        run: |
          set -euo pipefail
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          "$bt/aapt" dump badging "$apk" | grep -F "name='com.domenota.medialoader' versionCode='217' versionName='1.7.157'"
          test "$(unzip -Z1 "$apk" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
          if unzip -Z1 "$apk" | grep -q '^assets/ai/dexnet_vgg19_reflection_128.onnx$'; then
            echo '::error::91MB ONNX must not be embedded inside base APK'
            exit 1
          fi
          mkdir -p handoff/tools/lib handoff/tools/lib64
          "$bt/zipalign" -p -f 4 "$apk" handoff/ML_1.7.157_ARM64_ALIGNED_UNSIGNED.apk
          "$bt/zipalign" -c -v 4 handoff/ML_1.7.157_ARM64_ALIGNED_UNSIGNED.apk
          cp "$bt/zipalign" handoff/tools/
          cp "$bt/lib/apksigner.jar" handoff/tools/lib/
          cp -a "$bt/lib64/." handoff/tools/lib64/
          git archive --format=zip -o handoff/ML_1.7.157_SOURCES_EXACT_COMMIT.zip HEAD
          git rev-parse HEAD > handoff/COMMIT_SHA.txt
          (cd handoff && sha256sum ML_1.7.157_ARM64_ALIGNED_UNSIGNED.apk ML_1.7.157_SOURCES_EXACT_COMMIT.zip tools/lib/apksigner.jar > VERIFIED_SHA256.txt)
      - name: Private short-lived unsigned build handoff (NOT a Release)
        uses: actions/upload-artifact@v4
        with:
          name: ml-17157-unsigned-and-source-private-dom-enota-sign
          path: handoff/
          retention-days: 1
          if-no-files-found: error
  verified-reflection-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned genuine DExNet toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            'gdown==5.2.0' 'PyWavelets==1.7.0' 'numpy==1.26.4' \
            'Pillow==11.3.0' 'onnx==1.17.0' 'onnxruntime==1.20.1'
          python -m pip install --disable-pip-version-check --no-input \
            'torch==2.4.1+cpu' 'torchvision==0.19.1+cpu' \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Build actual pretrained DExNet plus VGG19, fail on wrong SHA
        env:
          ML_DEXNET_SIDE: '128'
          ML_REFLECTION_MODEL_OUTPUT_DIR: handoff-model
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qa/stage4_dexnet_full_inference_smoke.py
          model=handoff-model/dexnet_vgg19_reflection_128.onnx
          test -s "$model"
          test "$(stat -c%s "$model")" = 91341128
          test "$(sha256sum "$model" | cut -d' ' -f1)" = 0898eefd440b3adfc13b32b49b14c94e1acbf9b5ad5270f4022513b891a90917
          git rev-parse HEAD > handoff-model/COMMIT_SHA.txt
          (cd handoff-model && sha256sum dexnet_vgg19_reflection_128.onnx > VERIFIED_SHA256.txt)
      - name: Private short-lived optional ONNX handoff (NOT a Release)
        uses: actions/upload-artifact@v4
        with:
          name: ml-17157-verified-dexnet-vgg19-optional-model
          path: handoff-model/
          retention-days: 1
          if-no-files-found: error
