name: MediaLoader 1.7.136 signed ARM64 QA handoff
on:
  push:
    branches:
      - build/ml-17136-arm64-gallery-qa-v4-20261106
    paths:
      - .github/workflows/ml-17136-release-handoff.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-17136-release-handoff
  cancel-in-progress: false
jobs:
  assemble-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android 35 build-tools
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile ARM64 Release, never Debug
        run: gradle :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Check package, version, ABI and integrity
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" |
            grep -F "package: name='com.domenota.medialoader' versionCode='197' versionName='1.7.136'"
          test "$(unzip -Z1 "$apk" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
          mkdir -p out
          cp "$apk" out/ML_1.7.136_ARM64_UNSIGNED.apk
          sha256sum out/ML_1.7.136_ARM64_UNSIGNED.apk | tee out/sha256.txt
      - name: Upload unsigned Release for offline DomEnota signing
        uses: actions/upload-artifact@v4
        with:
          name: ml-17136-arm64-release-unsigned-local-sign
          path: out/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
