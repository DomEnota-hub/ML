name: MediaLoader v10 viewer and cutout QA
on:
  push:
    branches:
      - feature/ml-viewer-v10-parity-cutout-20261105
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-viewer-v10-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android 35 dependencies
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest -Parm64Release=true --stacktrace
      - name: Android lint
        if: success() || failure()
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: Compile production code and build ARM64 debug preview
        if: success() || failure()
        run: gradle :app:assembleDebug -Parm64Release=true --stacktrace
      - name: Upload reports and debug preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-viewer-v10-qa-${{ github.sha }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
