name: ML 1.7.205 HIDE/SHOW v2 stage1 full QA

on:
  push:
    branches:
      - feature/ml-17205-hidden-v2
    paths:
      - .github/workflows/ml-17205-hidden-v2-full-qa.yml
      - app/src/main/java/com/domenota/medialoader/data/catalog/visibility/**
      - app/src/test/java/com/domenota/medialoader/data/catalog/visibility/**
      - app/build.gradle
      - app/src/main/java/com/domenota/medialoader/data/download/MuzmoDownloadUrls.kt
      - app/src/main/java/com/domenota/medialoader/data/download/MuzmoDownloadEngine.kt
      - app/src/test/java/com/domenota/medialoader/data/download/MuzmoDownloadUrlsTest.kt
      - app/src/main/java/com/domenota/medialoader/ui/components/FolderVisibilityTransferUi.kt
      - app/src/main/java/com/domenota/medialoader/ui/screens/organization/CollectionCard.kt
      - app/src/main/java/com/domenota/medialoader/ui/MediaLoaderApp.kt
      - app/src/test/java/com/domenota/medialoader/ui/components/FolderVisibilityTransferUiTest.kt
      - app/src/test/java/com/domenota/medialoader/ui/screens/organization/LastCollectionCoverPresentationTest.kt
      - app/src/main/java/com/domenota/medialoader/ui/screens/MediaViewerScreen.kt
      - app/src/main/java/com/domenota/medialoader/ui/screens/VideoPlayerUiPolicy.kt
      - app/src/main/java/com/domenota/medialoader/ui/screens/VideoViewerPoster.kt
      - app/src/main/java/com/domenota/medialoader/ui/screens/gallery/GalleryViewerState.kt
      - app/src/main/java/com/domenota/medialoader/ui/screens/gallery/GalleryVideoChrome.kt
      - app/src/main/java/com/domenota/medialoader/data/playback/VideoWatchProgress.kt
      - app/src/test/java/com/domenota/medialoader/ui/screens/VideoPlayerUiPolicyTest.kt
      - app/src/test/java/com/domenota/medialoader/ui/screens/GalleryViewerStateTest.kt
      - app/src/test/java/com/domenota/medialoader/ui/screens/gallery/GalleryVideoChromeTest.kt
      - app/src/test/java/com/domenota/medialoader/data/playback/VideoWatchProgressTest.kt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new commit supersedes the previous full CI on this working branch.
  # This avoids concurrent Gradle dependency storms (Maven HTTP 429).
  group: ml-17205-qa-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  full-qa:
    if: github.ref == 'refs/heads/feature/ml-17205-hidden-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Gradle and Android SDK
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's#services.gradle.org/distributions#mirrors.huaweicloud.com/gradle#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for n in 1 2 3 4; do
            ./gradlew --version --no-daemon && break
            test "$n" != 4
            sleep 10
          done
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Version, UI and identity checks
        run: |
          set -euo pipefail
          grep -Eq 'versionCode 265$' app/build.gradle
          grep -Fq "versionName '1.7.205'" app/build.gradle
          test -s app/src/main/java/com/domenota/medialoader/data/catalog/visibility/VisibilityRecoveryPlan.kt
          test -s app/src/main/java/com/domenota/medialoader/data/catalog/visibility/VisibilityVerifiedCopy.kt
          test -s app/src/main/java/com/domenota/medialoader/data/storage/VisibilityVkSourceQuery.kt
          grep -q 'enteringRecoveryGate' app/src/main/java/com/domenota/medialoader/ui/LibraryViewModel.kt
          grep -q 'verifyInline = false' app/src/main/java/com/domenota/medialoader/data/catalog/visibility/FolderVisibilityCatalogBindings.kt
          python3 scripts/audit_ui_palette.py
          python3 scripts/check-round-sliders.py
          python3 scripts/check-in-app-notices.py
          grep -q 'Icons.Rounded.WarningAmber' app/src/main/java/com/domenota/medialoader/ui/screens/DownloadFolderSheet.kt
          ! grep -q 'перенос не завершён" else folder.name' app/src/main/java/com/domenota/medialoader/ui/screens/DownloadFolderSheet.kt
      - name: Full JVM suite including Compose, Gallery and privacy
        run: python3 scripts/run-jvm-isolated-compose.py full
      - name: Storage contract checks
        run: |
          set -euo pipefail
          grep -q 'MediaStore.Images.Media.EXTERNAL_CONTENT_URI' app/src/main/java/com/domenota/medialoader/data/storage/StorageManager.kt
          grep -q 'MediaStore.Video.Media.EXTERNAL_CONTENT_URI' app/src/main/java/com/domenota/medialoader/data/storage/StorageManager.kt
          grep -q 'moveSavedUriWhenCurrent' app/src/main/java/com/domenota/medialoader/core/database/HistoryDatabase.kt
          ! grep -q 'moveSavedUriWhenCurrent' app/src/main/java/com/domenota/medialoader/data/storage/LegacyMediaMigration.kt
      - name: Android lint
        run: ./gradlew :app:lintDebug -Parm64Release=true --stacktrace --no-daemon
      - name: Exact ARM64 unsigned QA
        run: ./gradlew :app:assembleRelease -Parm64Release=true --stacktrace --no-daemon
      - name: Verify unsigned handoff identity
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" > /tmp/ml204-badging.txt
          grep -F "name='com.domenota.medialoader'" /tmp/ml204-badging.txt
          grep -F "versionCode='265'" /tmp/ml204-badging.txt
          grep -F "versionName='1.7.205'" /tmp/ml204-badging.txt
          test "$(unzip -Z1 "$apk" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = "arm64-v8a"
          mkdir -p handoff
          cp "$apk" handoff/ML_1.7.205_ARM64_UNSIGNED.apk
          git rev-parse HEAD > handoff/EXACT_SOURCE_SHA.txt
          (cd handoff && sha256sum ML_1.7.205_ARM64_UNSIGNED.apk EXACT_SOURCE_SHA.txt > SHA256SUMS.txt)
      - name: Private unsigned handoff (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: ml17205-exact-unsigned-arm64
          path: handoff/
          compression-level: 0
          retention-days: 2
      - name: Save private-run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml17205-transfer-continuity-diagnostics
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/ml-jvm-shards/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 3
