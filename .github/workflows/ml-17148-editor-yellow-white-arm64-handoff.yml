name: MediaLoader 1.7.148 editor palette ARM64 private signing handoff
on:
  push:
    branches:
      - release/ml-17148-editor-yellow-white-20261108
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-17148-editor-arm64-qa
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Editor theme, text, photo and video regression tests
        run: |
          gradle :app:testDebugUnitTest -Parm64Release=true \
            --tests '*EditorPaletteTest' \
            --tests '*EditorTextDialogLayoutTest' \
            --tests '*PhotoEditorStageOneUiTest' \
            --tests '*PhotoEditorIntegratedRegressionTest' \
            --tests '*PhotoGeometryInteractionTest' \
            --tests '*PhotoDrawingTest' \
            --tests '*PhotoLocalEffectsTest' \
            --tests '*VideoOverlayUnifiedTextTest' \
            --tests '*VideoReferenceAdjustmentsTest' \
            --tests '*VideoTextDraftTest' \
            --tests '*VideoTextLaneEditTest' \
            --tests '*TextLayerStyleRenderingTest' \
            --tests '*TextTimingTest' \
            --tests '*GalleryQuickAccessTest' \
            --tests '*CutoutBrushSliderGeometryTest' \
            --tests '*FullscreenOrientationTest' \
            --tests '*GapiKeyStoreTest' --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: Compile genuine ARM64 Release without private keys
        run: gradle :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Verify identity version ABI and align unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -s "$apk"
          "$bt/aapt" dump badging "$apk" | grep -F "package: name='com.domenota.medialoader' versionCode='209' versionName='1.7.148'"
          test "$(unzip -Z1 "$apk" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = "arm64-v8a"
          mkdir -p handoff
          "$bt/zipalign" -p -f 4 "$apk" handoff/ML_1.7.148_ARM64_ALIGNED_UNSIGNED.apk
          "$bt/zipalign" -c -v 4 handoff/ML_1.7.148_ARM64_ALIGNED_UNSIGNED.apk
          sha256sum handoff/ML_1.7.148_ARM64_ALIGNED_UNSIGNED.apk > handoff/ALIGNED_UNSIGNED_SHA256.txt
      - name: Export unsigned ARM64 APK for offline signing (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: ml-17148-arm64-unsigned-private-signing
          path: handoff/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-17148-qa-diagnostics
          path: |
            app/build/test-results
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: warn
