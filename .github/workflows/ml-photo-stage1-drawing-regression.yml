name: ML photo editor stage 1 drawing regression (ARM64)
on:
  push:
    branches: [fix/ml-photo-stage1-drawing-crash-20261101]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ml-photo-stage1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  photo-stage1-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Drawing unit tests and full regression suite
        run: gradle :app:testDebugUnitTest -Parm64Release=true --stacktrace
      - name: Android lint
        if: success() || failure()
        run: gradle :app:lintDebug -Parm64Release=true --stacktrace
      - name: ARM64 debug compile (no APK publishing or signing)
        if: success() || failure()
        run: gradle :app:assembleDebug -Parm64Release=true --stacktrace
