name: MediaLoader 1.7.134 ARM64 Release local-sign handoff
on:
  push:
    branches:
      - release/ml-1.7.134-v10-signed-arm64-20261105
    paths:
      - .github/workflows/ml-17134-local-sign-handoff.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-17134-unsigned-handoff
  cancel-in-progress: true
jobs:
  unsigned:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android build tools
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble genuine unsigned ARM64 Release, not Debug
        run: gradle :app:assembleRelease -Parm64Release=true --stacktrace
      - name: Validate release package before local DomEnota signing
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$apk"
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$bt/aapt" dump badging "$apk" | grep -F "package: name='com.domenota.medialoader' versionCode='195' versionName='1.7.134'"
          test "$(unzip -Z1 "$apk" | awk -F/ '$1=="lib" {print $2}' | sort -u)" = arm64-v8a
          sha256sum "$apk" | tee app/build/outputs/apk/release/unsigned-sha256.txt
      - name: Bundle unsigned Release with official Android 35 signing utilities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff
          cp app/build/outputs/apk/release/app-release-unsigned.apk handoff/MediaLoader_1.7.134_ARM64_UNSIGNED.apk
          cp app/build/outputs/apk/release/unsigned-sha256.txt handoff/
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" handoff/
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" handoff/
          cp -a "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib64" handoff/
      - name: Upload unsigned release and tools; signing key stays local
        uses: actions/upload-artifact@v4
        with:
          name: ML-1.7.134-ARM64-Release-unsigned-local-DomEnota-sign
          path: handoff/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
